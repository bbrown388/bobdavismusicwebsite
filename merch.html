<!DOCTYPE html>
<html lang="en">
<head>
<!-- Open the connections the page cannot render without, before the parser reaches the
     script that needs them. The catalogue call goes to the Shopify API and every photo
     comes from their CDN, so paying DNS and TLS setup up front takes that latency off
     the first paint rather than adding to it. -->
<link rel="preconnect" href="https://6anqxb-rt.myshopify.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
<link rel="preconnect" href="https://bbrown388.github.io" crossorigin>
<link rel="dns-prefetch" href="https://cdn.shopify.com">

<script>
/* Fire the catalogue request here, at the top of the document, rather than where it is
   consumed at the bottom. Nothing on this page can render without it, and it used to be
   requested only after the parser had worked through the whole stylesheet and script,
   so the connection sat idle through all of that. Starting it now overlaps the round
   trip with parsing, which is the only lever available on a first visit, where there is
   no cached catalogue to fall back on.

   These constants live here because the request needs them; the main script below reuses
   the same ones rather than redeclaring them. */
const SHOP_DOMAIN = '6anqxb-rt.myshopify.com';
const STOREFRONT_TOKEN = '2a7e0382b6e5915658809f9549bb28a7';
const GQL = `https://${SHOP_DOMAIN}/api/2024-01/graphql.json`;

const CATALOG_QUERY = `{
  products(first: 20, sortKey: CREATED_AT, reverse: true) {
    edges {
      node {
        id title description descriptionHtml productType tags
        priceRange { minVariantPrice { amount currencyCode } }
        options { name values }
        images(first: 60) { edges { node { url altText width height } } }
        variants(first: 100) {
          edges {
            node {
              id title availableForSale
              selectedOptions { name value }
              image { url altText }
              priceV2 { amount currencyCode }
            }
          }
        }
      }
    }
  }
}`;

// Resolves to the parsed body, or an object carrying the error for loadProducts to handle.
window.__catalogRequest = fetch(GQL, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': STOREFRONT_TOKEN },
  body: JSON.stringify({ query: CATALOG_QUERY }),
}).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .catch(err => ({ __error: err }));

/* Canonical mockup order, fetched in parallel with the catalogue so it costs no extra
   time. Printful stores each colour's photos in the order its mockups were generated,
   which varied per colour, so Navy opened on a different kind of shot than Black. This
   map pins every photo to a fixed position. Regenerate it with tools/merch-mockup-order
   in the Claude working folder.

   Deliberately soft: any failure resolves to an empty map and the gallery falls back to
   its built-in sort. Same if Printful regenerates mockups, since the new filenames simply
   will not appear here. Wrong order is a blemish, a blank shop is not. */
window.ORDER_KEY = 'bd_image_order_v1';

/* Seed synchronously from the last visit, because the first paint on a repeat visit is
   drawn from the cached catalogue before any await, and it has to use the same order the
   repaint will. */
try { window.IMAGE_ORDER = JSON.parse(localStorage.getItem(window.ORDER_KEY)) || {}; }
catch { window.IMAGE_ORDER = {}; }

window.__imageOrder = Promise.race([
  fetch('https://bbrown388.github.io/bobdavismusic-data/merch/image-order.json')
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.order) || null)
    .catch(() => null),
  // A slow data host must never hold up the shop. Null means "keep what we already have".
  new Promise(res => setTimeout(() => res(null), 2500)),
]);
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merch | Bob Davis Music</title>
<meta name="description" content="Bob Davis merch, hats, tees, and more.">
<meta property="og:title" content="Bob Davis Merch">
<meta property="og:description" content="Hats, tees, and more from Texas country artist Bob Davis.">
<meta property="og:url" content="https://bobdavismusic.com/merch.html">
<meta property="og:image" content="https://bobdavismusic.com/images/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0608;
  color: #E8DCC8;
  font-family: Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 100px;
}

.back-nav {
  width: 100%;
  max-width: 480px;
  margin-bottom: 28px;
}

.back-link {
  font-size: 13px;
  color: #907860;
  text-decoration: none;
  letter-spacing: 1px;
  font-style: italic;
  transition: color 0.15s;
}
.back-link:hover { color: #FFD700; }

.section-label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #888;
  text-align: center;
  margin-bottom: 28px;
}

/* ── Category filters ─────────────── */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 0 auto 22px;
  max-width: 1180px;
}
.filter-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,215,0,0.22);
  color: #E8DCC8;
  font-family: Georgia, serif;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.filter-btn:hover { border-color: rgba(255,215,0,0.5); }
.filter-btn.active {
  background: rgba(255,215,0,0.14);
  border-color: rgba(255,215,0,0.65);
  color: #FFD700;
}
.filter-btn .count { opacity: 0.6; font-size: 12px; margin-left: 4px; }
/* .product-card sets display:flex, which beats the browser default [hidden]{display:none}.
   Without this the filter buttons set the attribute and nothing visibly happens. */
.product-card[hidden] { display: none !important; }

/* Lightbox filmstrip: the +N button used to open a single photo with no sign that the
   rest existed. Show every image along the bottom so the count is visibly browsable. */
.lb-strip {
  position: absolute;
  bottom: 46px;
  display: flex;
  gap: 6px;
  max-width: 94vw;
  overflow-x: auto;
  padding: 4px;
  scrollbar-width: thin;
}
.lb-strip button {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.06);
  cursor: pointer;
}
.lb-strip button.active { border-color: #FFD700; }
.lb-strip img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }

/* ── Lightbox ─────────────────────── */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 92vw;
  max-height: 82vh;
  object-fit: contain;
  border-radius: 6px;
}
.lb-close, .lb-prev, .lb-next {
  position: absolute;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,215,0,0.3);
  color: #E8DCC8;
  font-size: 26px;
  line-height: 1;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
}
.lb-close { top: 18px; right: 18px; font-size: 22px; }
.lb-prev  { left: 14px; }
.lb-next  { right: 14px; }
.lb-count {
  position: absolute;
  bottom: 20px;
  font-size: 13px;
  color: rgba(232,220,200,0.75);
  letter-spacing: 0.06em;
}
@media (max-width: 500px) {
  .lb-prev, .lb-next { width: 40px; height: 40px; font-size: 20px; }
}

/* ── Size guide + policy ──────────── */
.size-guide, .pdp-policy {
  margin-top: 18px;
  border-top: 1px solid rgba(255,215,0,0.14);
  padding-top: 14px;
  font-size: 13px;
  color: #b49a86;
}
.size-guide summary, .pdp-policy summary {
  cursor: pointer;
  color: #C9A227;
  letter-spacing: 0.04em;
  list-style: none;
  padding: 4px 0;
}
.size-guide summary::-webkit-details-marker, .pdp-policy summary::-webkit-details-marker { display: none; }
.size-guide summary::before, .pdp-policy summary::before { content: '+ '; }
.size-guide[open] summary::before, .pdp-policy[open] summary::before { content: '\2212 '; }
.size-guide summary:hover, .pdp-policy summary:hover { text-decoration: underline; }
.size-guide-scroll { overflow-x: auto; margin-top: 10px; }
.size-guide table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.size-guide th, .size-guide td {
  border: 1px solid rgba(255,215,0,0.16);
  padding: 6px 9px;
  text-align: center;
  white-space: nowrap;
}
.size-guide thead th { color: #E8DCC8; font-weight: normal; letter-spacing: 0.04em; }
.size-guide tbody th { color: #E8DCC8; font-weight: normal; }
.size-guide-note { margin-top: 8px; font-style: italic; opacity: 0.75; }
.pdp-policy p { margin-top: 10px; line-height: 1.65; }
.pdp-policy strong { color: #E8DCC8; }

/* ── Loading skeletons ────────────── */
.skeleton-card {
  border: 1px solid rgba(255,215,0,0.12);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.sk {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.10) 37%, rgba(255,255,255,0.05) 63%);
  background-size: 400% 100%;
  border-radius: 6px;
  animation: sk-shimmer 1.4s ease-in-out infinite;
}
.sk-img  { width: 100%; aspect-ratio: 4/3; }
.sk-line { width: 70%; height: 13px; }
.sk-line.short { width: 40%; }
@keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* ── Product page ─────────────────── */
/* body is a centred flex column, so a child with no width constraint sizes to its
   content. The 13-thumbnail rail made #product-view 778px wide inside a 390px phone,
   which is why overflow-x:auto never engaged and the whole page scrolled sideways.
   Constrain the chain and let every track shrink below its content. */
#grid-view, #product-view { width: 100%; min-width: 0; }
.pdp { width: 100%; max-width: 1080px; margin: 0 auto; min-width: 0; }
.pdp-cols > *, .pdp-gallery, .pdp-info { min-width: 0; }
.pdp-thumbs { max-width: 100%; }
.pdp-back {
  background: none;
  border: none;
  color: #C9A227;
  font-family: Georgia, serif;
  font-size: 14px;
  cursor: pointer;
  padding: 0 0 18px;
}
.pdp-back:hover { text-decoration: underline; }
.pdp-cols {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}
.pdp-gallery { position: sticky; top: 24px; }
.pdp-hero { aspect-ratio: 1 / 1; }
.pdp-hero .product-img { cursor: zoom-in; }
.pdp-thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 2px 4px;
  scrollbar-width: thin;
}
.pdp-viewall {
  background: none;
  border: none;
  color: #C9A227;
  font-family: Georgia, serif;
  font-size: 13px;
  cursor: pointer;
  padding: 2px 0 0;
}
.pdp-viewall:hover { text-decoration: underline; }
.pdp-title {
  font-size: 26px;
  font-weight: normal;
  letter-spacing: 0.02em;
  margin: 0 0 8px;
  color: #E8DCC8;
}
.pdp-price { font-size: 22px; color: #FFD700; margin-bottom: 6px; }
.pdp-ship { font-size: 12.5px; color: #9a7a64; margin: 0 0 22px; font-style: italic; }
.pdp-info .option-label { margin-top: 16px; }
.pdp-add { margin-top: 26px; width: 100%; }
.pdp-desc {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,215,0,0.14);
  font-size: 13.5px;
  line-height: 1.7;
  color: #b49a86;
  text-align: left;
}
.pdp-desc ul { margin: 10px 0 0 18px; }
.pdp-desc li { margin-bottom: 5px; }

@media (max-width: 780px) {
  /* minmax(0,1fr), not 1fr: a bare 1fr is minmax(auto,1fr) and refuses to shrink
     below its content, which reintroduces the sideways scroll. */
  .pdp-cols { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .pdp-gallery { position: static; }
  .pdp-title { font-size: 22px; }
}

/* ── Grid card extras ─────────────── */
.g-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  margin-top: 2px;
}
.g-swatch {
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255,215,0,0.3);
  background: #fff;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
}
.g-swatch:hover { border-color: #FFD700; transform: scale(1.12); }
/* Printful shoots on white with the product filling roughly the middle half, so a
   straight cover-crop of a 26px circle is mostly background and every colour ends up
   looking like the same pale dot. Zoom into the centre so the swatch shows the product. */
.g-swatch img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scale(1.9);
}
.g-count { font-size: 11px; color: #9a7a64; letter-spacing: 0.05em; }
.g-sold { font-size: 12px; color: #9a7a64; font-style: italic; }
.product-card { cursor: pointer; }

/* ── Product grid ─────────────────── */
.product-grid {
  display: grid;
  /* 260px keeps two columns on a small phone in landscape and lets a desktop
     window fill out to four. The old 480px cap made the whole shop render at
     phone width no matter how big the screen was. */
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto 16px;
}
.product-grid.single {
  grid-template-columns: minmax(0, 340px);
  justify-content: center;
  max-width: 100%;
}

/* ── Product card ─────────────────── */
.product-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,215,0,0.15);
  border-radius: 12px;
  padding: 18px;
  min-width: 0;          /* same reason as .img-thumbs: let the grid track shrink */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: border-color 0.2s, background 0.2s;
}
.product-card:hover {
  background: rgba(255,215,0,0.04);
  border-color: rgba(255,215,0,0.35);
}

/* ── Product image ────────────────── */
.product-img-wrap {
  width: 100%;
  aspect-ratio: 4/3;
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  /* Printful photographs on white, and the images are letterboxed by object-fit:contain.
     A white tile makes the bars blend into the photo instead of framing it in a
     mismatched panel. */
  background: #fff;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
}
.product-img {
  width: 100%;
  height: 100%;
  /* contain, not cover. The wrapper is a 4/3 landscape box, so cover crops the top and
     bottom off anything tall -- a 22oz bottle lost its cap and its base. Caps survived
     because they are wide. Printful shoots on plain backgrounds, so letterboxing a tall
     product reads as intentional where a decapitated bottle does not. */
  object-fit: contain;
  display: block;
  cursor: zoom-in;
  transition: opacity 0.15s ease;
}
.product-img.fading { opacity: 0; }

/* ── Product text ─────────────────── */
.product-name {
  font-size: 15px;
  color: #FFD700;
  text-align: center;
  letter-spacing: 0.3px;
  line-height: 1.3;
  width: 100%;
}
.product-price {
  font-size: 16px;
  color: #b09878;
  font-weight: 600;
}

/* ── Variant buttons ──────────────── */
.variant-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 42px;
  gap: 6px;
  width: 100%;
}
.variant-btn {
  height: 100%;
  padding: 4px 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  color: #C8B89A;
  font-family: Georgia, serif;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  text-align: center;
  line-height: 1.3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.variant-btn:hover:not(:disabled) {
  background: rgba(255,215,0,0.08);
  border-color: rgba(255,215,0,0.3);
  color: #E8DCC8;
}
.variant-btn.active {
  background: rgba(255,215,0,0.12);
  border-color: rgba(255,215,0,0.5);
  color: #FFD700;
}
.variant-btn:disabled {
  opacity: 0.3;
  cursor: default;
  text-decoration: line-through;
}

/* ── Add to cart button ───────────── */
.add-btn {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255,215,0,0.24);
  border: 1px solid rgba(255,215,0,0.6);
  border-radius: 8px;
  color: #FFD700;
  font-family: Georgia, serif;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, filter 0.15s;
  margin-top: auto;
}
.add-btn:hover:not(:disabled) {
  background: rgba(255,215,0,0.34);
  filter: brightness(1.1);
}
.add-btn:disabled { opacity: 0.45; cursor: default; }

/* ── Status messages ──────────────── */
.status-msg {
  color: #888;
  font-style: italic;
  font-size: 14px;
  text-align: center;
  padding: 40px 0;
  grid-column: 1 / -1;
}
.error-msg {
  color: #907860;
  font-style: italic;
  font-size: 14px;
  text-align: center;
  padding: 40px 0;
}

/* ── Cart toggle ──────────────────── */
.cart-toggle {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,215,0,0.12);
  border: 1px solid rgba(255,215,0,0.4);
  border-radius: 24px;
  color: #FFD700;
  font-family: Georgia, serif;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.5px;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.15s;
  z-index: 100;
}
.cart-toggle:hover { background: rgba(255,215,0,0.2); }
.cart-count {
  background: #FFD700;
  color: #0d0608;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
}

/* ── Cart overlay ─────────────────── */
.cart-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
}
.cart-overlay.visible { display: block; }

/* ── Cart drawer ──────────────────── */
.cart-drawer {
  position: fixed;
  top: 0;
  right: -360px;
  width: 320px;
  height: 100%;
  background: #140a0c;
  border-left: 1px solid rgba(255,215,0,0.15);
  display: flex;
  flex-direction: column;
  z-index: 300;
  transition: right 0.28s ease;
  padding: 24px 20px;
}
.cart-drawer.open { right: 0; }

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,215,0,0.1);
}
.cart-header span {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #888;
}
.cart-close {
  background: none;
  border: none;
  color: #888;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  transition: color 0.15s;
}
.cart-close:hover { color: #FFD700; }

.cart-empty {
  color: #888;
  font-style: italic;
  font-size: 14px;
  text-align: center;
  padding: 40px 0;
}
.cart-items {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
/* Thumbnail. Printful shoots on white, so the tile reads as a white card on the dark
   drawer; the border keeps it from bleeding into the background at its edges. */
.cart-item-img {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  object-fit: contain;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,215,0,0.12);
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name {
  font-size: 14px;
  color: #E8DCC8;
  margin-bottom: 4px;
  line-height: 1.3;
}
/* Chosen variant, one chip per option, so "Color Navy" and "Size S/M" read as facts
   rather than as Shopify's slash-joined "Navy / S/M" blob. */
.cart-item-opts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
  margin-bottom: 8px;
}
.cart-item-opt {
  font-size: 11px;
  color: #C8B89A;
  background: rgba(255,215,0,0.07);
  border: 1px solid rgba(255,215,0,0.14);
  border-radius: 4px;
  padding: 2px 7px;
  line-height: 1.5;
}
.cart-item-opt em {
  font-style: normal;
  color: #907860;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  font-size: 9px;
  margin-right: 4px;
}
.cart-item-qty {
  display: inline-flex;
  align-items: center;
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: 6px;
  overflow: hidden;
}
.cart-item-qty button {
