<script>
// SHOP_DOMAIN, STOREFRONT_TOKEN and GQL are declared in the head, where the catalogue
// request is kicked off before this script is even parsed.

let cartId = localStorage.getItem('bd_cart_id');
let currentCart = null;

async function shopify(query, variables = {}) {
  const res = await fetch(GQL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Shopify-Storefront-Access-Token': STOREFRONT_TOKEN,
    },
    body: JSON.stringify({ query, variables }),
    signal: AbortSignal.timeout(30000),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

function fmt(amount, currency) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency }).format(amount);
}

// ── Products ──────────────────────────────────────────────

/* Render from the last known catalogue immediately, then refresh in the background.
   The Shopify round trip is the entire "Loading..." window, so a returning visitor
   should never see it. Cached for a day; a shorter window would refetch constantly and
   a longer one risks showing a price that has changed. The background refresh always
   runs, so a stale render is corrected within the same visit. */
const CATALOG_KEY = 'bd_catalog_v1';
const CATALOG_TTL = 24 * 60 * 60 * 1000;

function readCatalog() {
  try {
    const raw = localStorage.getItem(CATALOG_KEY);
    if (!raw) return null;
    const { at, products } = JSON.parse(raw);
    if (!at || !Array.isArray(products) || Date.now() - at > CATALOG_TTL) return null;
    return products;
  } catch { return null; }
}

function writeCatalog(products) {
  // Quota is ~5MB and the catalogue is large; failing to cache must never break the page.
  try { localStorage.setItem(CATALOG_KEY, JSON.stringify({ at: Date.now(), products })); }
  catch { try { localStorage.removeItem(CATALOG_KEY); } catch {} }
}

async function loadProducts() {
  const cached = readCatalog();
  if (cached) {
    window.__renderSource = 'cache';
    try { renderProducts(mergeProducts(cached)); } catch { /* fall through to the network */ }
    window.__renderSource = 'network';
  }
  /* Settle the canonical image order before the network repaint. Both fetches were started
     together in the head, so awaiting them one after the other costs the slower of the two,
     not the sum. */
  const orderBefore = JSON.stringify(window.IMAGE_ORDER || {});
  try {
    const freshOrder = await (window.__imageOrder || Promise.resolve(null));
    if (freshOrder) {
      window.IMAGE_ORDER = freshOrder;
      try { localStorage.setItem(window.ORDER_KEY, JSON.stringify(freshOrder)); } catch {}
    }
  } catch {}
  const orderChanged = JSON.stringify(window.IMAGE_ORDER || {}) !== orderBefore;

  try {
    // Await the request the head already started, rather than issuing a second one.
    const json = await (window.__catalogRequest || shopify(CATALOG_QUERY).then(d => ({ data: d })));
    if (json.__error) throw json.__error;
    if (json.errors) throw new Error(json.errors[0].message);
    const data = json.data;
    const fresh = data.products.edges.map(e => e.node);
    writeCatalog(fresh);
    _products = mergeProducts(fresh);

    /* Skip the repaint ONLY when there is already something on screen to preserve, i.e.
       a product page drawn from cache. Testing the hash alone was wrong: on a cold load
       of a direct product link there is no cached render, so skipping meant nothing was
       ever drawn and route() never ran, because route() is only called from
       renderProducts. The page sat on skeletons forever. Loading the grid first seeded
       the cache, which is why the same link worked on a second visit. */
    const alreadyDrawn = !!document.querySelector('.product-card, .pdp');
    const onProduct = /^#\/product\//.test(location.hash || '');
    // orderChanged forces the repaint on the first visit after the order map changes,
    // otherwise that visit would keep a gallery drawn from cache in the stale order.
    if (!(alreadyDrawn && onProduct) || orderChanged) renderProducts(_products);
  } catch (err) {
    console.error(err);
    // A cached render is better than an error screen when the network is the problem.
    if (!document.querySelector('.product-card')) {
      document.getElementById('product-grid').innerHTML = '';
      document.getElementById('error-msg').hidden = false;
    }
  }
}

/* Shopify hands back option values in whatever order Printful pushed them, which for
   the tee is M, L, XL, 2XL, 3XL, 4XL, S -- small last. Sorting here rather than
   fixing the data, because a Printful re-push would undo a manual fix in Shopify. */
const SIZE_RANK = ['XS','S','S/M','M','L','L/XL','XL','XXL','2XL','XXXL','3XL','4XL','5XL','ONE SIZE'];
function sizeRank(v) {
  const i = SIZE_RANK.indexOf(String(v).trim().toUpperCase());
  return i === -1 ? SIZE_RANK.length : i;   // unknown sizes sort to the end, order preserved
}
function sortSizes(values) {
  return [...values].sort((a, b) => sizeRank(a) - sizeRank(b));
}

/* productType is set on only three of the seven products (EMBROIDERY, DRINKWARE, blank),
   so it cannot be the sole source. Try it, then tags, then fall back to the title. */
const CATEGORIES = [
  { key: 'shirts',    label: 'Shirts',    test: s => /t-?shirt|tee|hoodie|sweat/.test(s) },
  { key: 'hats',      label: 'Hats',      test: s => /cap|hat|trucker|beanie|snapback/.test(s) },
  { key: 'drinkware', label: 'Drinkware', test: s => /bottle|tumbler|mug|glass|koozie|cooler|drinkware/.test(s) },
];
/* Production time before anything ships, from Printful's published fulfillment ranges:
   2-5 business days for DTG apparel, 3-7 for embroidery, 1-3 for non-print items. US
   transit adds roughly 3-8 business days on top.

   The old copy said "ships 3-5 business days" for everything, which understated the
   embroidered caps even before transit, and read to a shopper as a delivery estimate
   when door to door is really 5-13 business days. State production honestly and let
   Shopify's checkout, which has automated delivery dates turned on, give the arrival
   estimate: that is the only figure guaranteed to match what they see next. */
const MAKE_TIME = {
  shirts:    'printed in 2 to 5 business days',
  hats:      'embroidered in 3 to 7 business days',
  drinkware: 'made in 1 to 3 business days',
  other:     'made to order',
};

function categoryOf(p) {
  const hay = [p.productType, (p.tags || []).join(' '), p.title].filter(Boolean).join(' ').toLowerCase();
  return (CATEGORIES.find(c => c.test(hay)) || { key: 'other' }).key;
}

/* Printful cannot carry two embroidery thread colours in one product, so a single cap
   design ships as two Shopify products. Merge them back together for display only.

   This list is deliberately EXPLICIT: exact product titles, nothing inferred. Do not
   replace it with pattern matching that guesses which products belong together -- two
   caps sharing words in their titles are not necessarily the same design, and silently
   merging the wrong pair would sell someone a hat they did not choose. */
const MERGE_GROUPS = [
  { title: 'BD Logo Trucker Cap', option: 'Embroidery', members: [
      { product: 'BD Logo Trucker Cap - Black Embroidered', label: 'Black' },
      { product: 'BD Logo Trucker Cap - Red Embroidered',   label: 'Red'   } ] },
  { title: 'Bob Davis Trucker Cap', option: 'Embroidery', members: [
      { product: 'Bob Davis Trucker Cap - Black Embroidered', label: 'Black' },
      { product: 'Bob Davis Trucker Cap - Red Embroidered',   label: 'Red'   } ] },
];

/* Which variant a product opens on, in the grid and on its product page.

   Without an entry the default is whichever variant Shopify happens to return first,
   which Printful controls and reshuffles on a re-push. Keyed by exact product title,
   same as MERGE_GROUPS, so a re-push cannot silently change what every visitor sees
   first. Any option can be pinned, not just colour: the merged caps need an embroidery
   thread colour as well. Values must match Shopify's option strings exactly, spacing
   included ("Black/ White/ Black"). Anything that no longer exists is dropped rather
   than breaking the page. */
const DEFAULT_SELECTION = {
  'BD Logo Trucker Cap':            { Embroidery: 'Black', Color: 'Black/ White/ Black' },
  'Bob Davis Trucker Cap':          { Embroidery: 'Red',   Color: 'Black' },
  '2 Dolla Bill T-Shirt':           { Color: 'Black' },
  'Copper Vacuum Insulated Bottle': { Color: 'Red' },
  'BD Logo Structured Twill Cap':   { Color: 'Red' },
};

function defaultSelectionFor(p, options) {
  const want = DEFAULT_SELECTION[p.title];
  if (!want) return null;
  const ok = {};
  for (const [name, value] of Object.entries(want)) {
    const opt = options.find(o => o.name.toLowerCase() === name.toLowerCase());
    if (opt && opt.values.includes(value)) ok[opt.name] = value;
  }
  return Object.keys(ok).length ? ok : null;
}

function mergeProducts(products) {
  const byTitle = new Map(products.map(p => [p.title, p]));
  const consumed = new Set();
  const merged = [];

  for (const g of MERGE_GROUPS) {
    const found = g.members.filter(m => byTitle.has(m.product));
    if (found.length < 2) continue;            // nothing to merge, leave them alone
    found.forEach(m => consumed.add(m.product));

    const parts = found.map(m => ({ label: m.label, p: byTitle.get(m.product) }));
    const base  = parts[0].p;

    // Stamp the embroidery colour onto every variant so the existing variant matcher,
    // which compares the full selectedOptions set, resolves the right one.
    const variants = parts.flatMap(({ label, p }) =>
      p.variants.edges.map(e => ({
        ...e.node,
        selectedOptions: [...(e.node.selectedOptions || []), { name: g.option, value: label }],
      })));

    // Union the child options, keeping each option's first-seen value order.
    const optMap = new Map();
    parts.forEach(({ p }) => (p.options || []).forEach(o => {
      const cur = optMap.get(o.name) || [];
      optMap.set(o.name, [...cur, ...o.values.filter(v => !cur.includes(v))]);
    }));

    merged.push({
      ...base,
      title: g.title,
      options: [{ name: g.option, values: parts.map(x => x.label) },
                ...[...optMap].map(([name, values]) => ({ name, values }))],
      variants: { edges: variants.map(node => ({ node })) },
      // Tag each photo with the embroidery it belongs to. Without this the gallery
      // shows both thread colours at once and switching embroidery only changes the
      // hero image while the thumbnails keep showing the other design.
      images: { edges: parts.flatMap(({ label, p }) =>
        p.images.edges.map(e => ({ node: { ...e.node, emb: label } }))) },
      priceRange: base.priceRange,
    });
  }

  const rest = products.filter(p => !consumed.has(p.title));
  return [...merged, ...rest];
}

/* Pull the measurement table out of Shopify's description HTML. Printful ships one for
   garments (the tee has an eight row table) and not for everything, so this returns null
   when there is nothing to show rather than rendering an empty panel.

   Parsed with DOMParser rather than innerHTML so nothing in the fetched markup can run,
   and rebuilt cell by cell into a clean table instead of trusting their attributes. */
function sizeTableFrom(html) {
  if (!html || !/<table/i.test(html)) return null;
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch { return null; }
  const table = doc.querySelector('table');
  if (!table) return null;
  const rows = [...table.querySelectorAll('tr')]
    .map(tr => [...tr.querySelectorAll('th,td')].map(c => c.textContent.trim()))
    .filter(cells => cells.some(c => c));
  if (rows.length < 2) return null;
  return rows;
}

function sizeGuideMarkup(p, sid) {
  const rows = sizeTableFrom(p.descriptionHtml);
  if (!rows) return '';
  const [head, ...body] = rows;
  return `<details class="size-guide" id="sizeguide-${sid}">
      <summary>Size guide</summary>
      <div class="size-guide-scroll">
        <table>
          <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${body.map(r => `<tr>${r.map((c, i) =>
            i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
      <p class="size-guide-note">Measurements are of the garment, not the body.</p>
    </details>`;
}

/* ── Gallery filtering ────────────────────────────────────
   Colour is the primary thing a shopper is choosing, so the gallery should show that
   colour and nothing else. Printful names every file after its variant, which is the
   only link between a photo and a colour the Storefront API gives us. */
const _slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

function colorOfImage(url, values) {
  const file = String(url || '').split('/').pop().split('?')[0].toLowerCase();
  // Longest match wins, so "Black/ White" beats a bare "Black" on the same filename.
  return values
    .filter(v => { const s = _slug(v); return s && new RegExp(`(^|-)${s}(-|\\.|$)`).test(file); })
    .sort((a, b) => _slug(b).length - _slug(a).length)[0] || null;
}

/* The camera angle a photo shows, derived by stripping the colour and Printful's trailing
   hash off the filename. Everything left ("front", "back", "front-2", "front-and-back")
   is stable across colours, which is what lets the gallery keep its order. */
function angleOf(url, colorValues) {
  let f = String(url || '').split('/').pop().split('?')[0].toLowerCase().replace(/\.[a-z0-9]+$/, '');
  f = f.replace(/-[0-9a-f]{8,}$/, '');
  const c = colorOfImage(url, colorValues);
  if (c) f = f.replace(new RegExp(`(^|-)${_slug(c)}(-|$)`), '$1');
  return f;
}

/* Order every colour's photos the same way, so changing colour looks like the shirt was
   recoloured rather than the gallery being reshuffled. Sorts by camera angle first,
   using the order those angles first appear across the whole product, then by the
   product's own colour order. The second key is what keeps the trucker caps (one photo
   per colour, all the same angle) in a consistent order across embroidery colours. */
function canonicalOrder(p, colorValues) {
  const angles = [], all = (p.images?.edges || []).map(e => e.node);
  all.forEach(im => { const a = angleOf(im.url, colorValues); if (!angles.includes(a)) angles.push(a); });
  /* Third key is pixel area. Printful gives each colour one 1000x1000 image, the variant's
     primary mockup, and ships the rest at 2000x2000. Several of those share the exact same
     angle token (three files per cap colour are all "<colour>-front-<hash>"), so the angle
     key cannot separate them and the sort would otherwise fall back to Printful's own
     order, which differs per colour. Area at least pins the primary mockup to first, so
     every colour opens on the same kind of shot.

     It cannot order the same-size, same-angle photos among themselves, because nothing in
     the Storefront API distinguishes them. That is what the map below is for; these keys
     are the fallback for anything the map does not cover. */
  /* Primary key, when we have it, is the canonical position from image-order.json, which
     identifies each photo by what it actually shows rather than by its metadata. That is
     the only thing able to separate same-angle, same-size shots. Images missing from the
     map sort after the mapped ones and then fall through to the keys below, so a partial
     or stale map degrades instead of breaking. */
  const fixed = window.IMAGE_ORDER || {};
  const pinned = im => {
    const r = fixed[im.url.split('/').pop().split('?')[0]];
    return r === undefined ? 99 : r;
  };
  return im => [
    pinned(im),
    angles.indexOf(angleOf(im.url, colorValues)),
    (im.width || 0) * (im.height || 0),
    colorValues.indexOf(colorOfImage(im.url, colorValues)),
  ];
}

/* Narrow the gallery to the current selection, most specific first. Each filter is
   skipped when it would empty the gallery: a product whose filenames do not encode the
   colour keeps all its photos rather than showing none. */
function galleryFor(p, options, selected) {
  let imgs = (p.images?.edges || []).map(e => e.node);

  const embOpt = options.find(o => /^embroidery$/i.test(o.name));
  if (embOpt && selected[embOpt.name]) {
    const hit = imgs.filter(im => im.emb === selected[embOpt.name]);
    if (hit.length) imgs = hit;
  }

  /* Only narrow by colour when it still leaves something to browse. The trucker caps
     have exactly one photo per colour, so filtering there would replace a 13-image
     gallery with a single shot and no way to see the others. Products shot from several
     angles per colour (the tee has four, the twill cap six) do filter. */
  const colorOpt = options.find(o => /^colou?r$/i.test(o.name));
  if (colorOpt && selected[colorOpt.name]) {
    const hit = imgs.filter(im => colorOfImage(im.url, colorOpt.values) === selected[colorOpt.name]);
    if (hit.length > 1) imgs = hit;
  }

  if (colorOpt) {
    const key = canonicalOrder(p, colorOpt.values);
    imgs = imgs.slice().sort((a, b) => {
      const ka = key(a), kb = key(b);
      return (ka[0] - kb[0]) || (ka[1] - kb[1]) || (ka[2] - kb[2]) || (ka[3] - kb[3]);
    });
  }
  return imgs;
}

function thumbsMarkup(imgs, sid, activeUrl) {
  if (imgs.length < 2) return '';
  /* Ask the CDN for the size actually shown. These render at 50px but were pulling the
     2000px original, about 135KB each, so the tee's rail alone was ~3.8MB. 150px covers
     a 3x screen and costs about 3KB. data-img-url keeps the ORIGINAL url, because every
     comparison in the page matches on that. */
  return `<div class="img-thumbs pdp-thumbs" id="ithumbs-${sid}">
      ${imgs.map((img, n) => `<button class="img-thumb${img.url === activeUrl ? ' active' : ''}"
        data-img-url="${esc(img.url)}" data-img-alt="${esc(img.altText)}"
        onclick="selectThumb(this,'${sid}')">
        <img src="${esc(cdnThumb(img.url, 150))}" alt="${esc(img.altText)}"
             ${n < 8 ? '' : 'loading="lazy"'}>
      </button>`).join('')}
    </div>
    <button class="pdp-viewall" id="viewall-${sid}" onclick="openLightbox('${sid}')">View all ${imgs.length} photos</button>`;
}

/* ── Prefetching ──────────────────────────────────────────
   Worth doing only because the images are right-sized now: a hero is about 46KB rather
   than the 135KB original, so warming a handful costs less than one old thumbnail did.

   Deliberately narrow. Prefetching every photo of every colour would be megabytes for
   choices most shoppers never make, so this warms exactly two things: the first photo of
   a product the pointer is hovering, and the remaining colours of the product already
   open. Both are things the shopper has shown intent toward. */
const _warmed = new Set();

function warm(url, px) {
  if (!url) return;
  const sized = cdnThumb(url, px);
  if (_warmed.has(sized)) return;
  _warmed.add(sized);
  const img = new Image();
  img.decoding = 'async';
  img.src = sized;
}

// Hovering a card usually precedes the click by a few hundred ms, which is enough.
function warmProduct(sid) {
  const p = _products.find(x => safeId(x.id) === sid);
  if (!p) return;
  warm(p.variants.edges[0]?.node?.image?.url || p.images.edges[0]?.node?.url, 1000);
}

/* Warm what a colour switch actually requests, which is not what the variant record
   points at. Switching colour rebuilds the thumbnail rail, so the visible cost is that
   colour's THUMBNAILS at 150px, plus whichever gallery photo the held position lands on
   at 1000px. Warming only the variant's own hero, as this did at first, warmed a file
   the switch frequently never asks for and left the rail to fetch cold.

   Thumbnails are about 3KB each, so every colour's full rail is affordable at idle: 13
   colours of a cap is roughly 150KB. Heroes are 46KB, so only the first photo per colour
   is warmed here and the rest are left to the hover handler. */
/* Warm everything a shopper can reach from an open product page, in the order they are
   likely to reach it. Queued rather than fired at once: a cap with 13 colours is a few
   megabytes at full size, and dumping that into the network the moment a page opens
   would compete with the photos actually on screen. One item per idle slice keeps it
   invisible, and the browser drops the whole thing the moment the page is left.

   Priority order, limited to what is genuinely one interaction away:
     1. Full size for every photo of the CURRENT colour. These are one click away on the
        thumbnail rail, so they are the most likely next request.
     2. Thumbnails for every other colour, about 3KB each. Cheap, and they are what a
        colour switch rebuilds.
     3. Full size for the first photo of every other colour, the hero a switch lands on.

   Deliberately NOT the rest of every other colour at full size. Reaching one of those
   takes TWO interactions, selecting the colour and then picking a thumbnail, and none of
   them is on screen until the first happens. Warming them here was the difference
   between 10 and 28 full-size files on the tee, spent mostly on photos nobody opens.
   They are warmed instead the moment a colour is actually selected. */
function warmOtherColors(sid) {
  const card = _cards[sid];
  if (!card || !card.product) return;

  const queue = [];
  (card.images || []).forEach(im => queue.push([im.url, 1000]));

  /* One click away means changing exactly ONE option. On a merged cap that is both the
     other thread colour at the current cap colour, and every other cap colour at the
     current thread colour. Combinations needing two clicks are left alone: warming the
     other embroidery's twelve other colours would be most of the catalogue.

     Driven off the options themselves rather than naming colour explicitly, so it stays
     correct if a product ever carries a third image-affecting option. Size is excluded
     because it does not change the photos. */
  const visualOpts = (card.options || []).filter(o => /^(colou?r|embroidery)$/i.test(o.name));
  const neighbours = [];
  for (const opt of visualOpts) {
    for (const value of opt.values) {
      if (value === card.selected[opt.name]) continue;
      const imgs = galleryFor(card.product, card.options, { ...card.selected, [opt.name]: value });
      if (imgs.length) neighbours.push(imgs);
    }
  }
  /* Which photo a neighbour opens on depends on where the shopper is NOW, because a
     switch preserves their position in the gallery. Warming each neighbour's first photo
     was only right when they happened to be on the first photo; anyone looking at the
     third shot switched and then waited for the third shot to download. Warm the photo at
     the CURRENT index instead, which is what a click would actually display. */
  const rail = document.getElementById('ithumbs-' + sid);
  const at = rail
    ? Math.max(0, [...rail.querySelectorAll('.img-thumb')].findIndex(b => b.classList.contains('active')))
    : 0;

  // Thumbnails first: they are what a switch rebuilds, and they are ~3KB each.
  neighbours.forEach(imgs => imgs.forEach(im => queue.push([im.url, 150])));
  neighbours.forEach(imgs => queue.push([imgs[Math.min(at, imgs.length - 1)].url, 1000]));

  warmQueue(sid, card, queue);
}

/* Drain a warm list one item per idle slice, so it never competes with the photos on
   screen, and abandon it if the shopper leaves the product. */
function warmQueue(sid, card, queue) {
  let i = 0;
  const pump = deadline => {
    if (_cards[sid] !== card) return;
    do { const item = queue[i++]; if (item) warm(item[0], item[1]); }
    while (i < queue.length && deadline && deadline.timeRemaining && deadline.timeRemaining() > 8);
    if (i < queue.length) schedule();
  };
  const schedule = () => window.requestIdleCallback
    ? requestIdleCallback(pump, { timeout: 3000 })
    : setTimeout(() => pump(null), 120);
  schedule();
}

/* Hovering a colour pill is a strong signal and precedes the click by a few hundred ms,
   which is enough to have the full-size photo decoded before it is needed. */
function warmColor(sid, value) {
  const card = _cards[sid];
  if (!card || !card.product) return;
  const colorOpt = card.options.find(o => /^colou?r$/i.test(o.name));
  if (!colorOpt) return;
  const imgs = galleryFor(card.product, card.options, { ...card.selected, [colorOpt.name]: value });
  imgs.slice(0, 4).forEach((im, i) => warm(im.url, i === 0 ? 1000 : 150));
}

/* The original url of whatever the hero is showing. src carries a CDN-resized variant,
   so it can never be compared against the image list directly. */
function heroRaw(sid) {
  return document.getElementById('img-' + sid)?.dataset.raw || null;
}

/* Swap the hero without letting it go blank. Assigning src directly clears the element
   while the new file downloads, which is the flash of nothing between colours. Decode
   the replacement off-screen first, then swap; the old photo stays up until the new one
   is ready. Costs no extra bandwidth, the browser fetches the same file either way. */
function setHero(sid, img) {
  const el = document.getElementById('img-' + sid);
  if (!el || !img) return;
  const url = cdnThumb(img.url, 1000);
  el.dataset.raw = img.url;              // set immediately so state reads stay correct
  el.alt = img.altText || '';
  const pre = new Image();
  const show = () => { el.src = url; el.classList.remove('fading'); };
  pre.onload = show;
  pre.onerror = show;                     // never strand the shopper on a stale photo
  pre.src = url;
  if (pre.complete) show();               // already cached, swap now, no flicker at all
}

/* Show the nth photo of the current gallery, updating the hero and the active thumb. */
function jumpGalleryTo(sid, n) {
  const card = _cards[sid];
  const imgs = card?.images || [];
  if (!imgs.length) return;
  const pick = imgs[Math.min(Math.max(0, n), imgs.length - 1)];
  setHero(sid, pick);
  document.querySelectorAll('#ithumbs-' + sid + ' .img-thumb').forEach(b =>
    b.classList.toggle('active', b.dataset.imgUrl === pick.url));
}

/* Re-point the gallery after a colour change, without rebuilding the whole page and
   throwing away the shopper's scroll position.

   Holds the shopper's place in the gallery: if they were looking at the third photo,
   they stay on the third photo of the new colour. Because every colour is ordered the
   same way, that is the same camera angle, so the page reads as the garment changing
   colour rather than the gallery jumping somewhere else. */
function refreshGallery(sid) {
  const card = _cards[sid];
  if (!card) return;
  const rail = document.getElementById('ithumbs-' + sid);
  const wrap = rail?.parentElement;

  const wasAt = rail
    ? Math.max(0, [...rail.querySelectorAll('.img-thumb')].findIndex(b => b.classList.contains('active')))
    : 0;

  const imgs = galleryFor(card.product, card.options, card.selected);
  card.images = imgs;
  if (!imgs.length || !wrap) return;

  /* Two different right answers depending on whether the gallery narrowed.

     When it did (the tee: four Sage photos replace four Black ones) the content changed
     under the shopper, so holding their position keeps them on the same camera angle.

     When it did not, the rail still holds every colour -- the trucker caps have one
     photo per colour, so filtering would leave a gallery of one. Holding position there
     means picking a colour changes nothing at all, which is what it did. Jump to the
     chosen colour's photo instead. */
  /* If the photo on screen survives into the new gallery, keep it. Clicking a thumbnail
     also applies that photo's colour, which lands here; without this the gallery would
     re-point the hero to the held position and visibly flash the default image over the
     one just clicked. An explicit choice outranks any positional rule. */
  const showing = heroRaw(sid);
  const keptIndex = showing ? imgs.findIndex(im => im.url === showing) : -1;

  const colorOpt = card.options.find(o => /^colou?r$/i.test(o.name));
  const chosen = colorOpt && card.selected[colorOpt.name];
  let at = Math.min(wasAt, imgs.length - 1);
  if (keptIndex >= 0) at = keptIndex;
  else if (chosen) {
    const colorOf = im => colorOfImage(im.url, colorOpt.values);
    const mixed = imgs.some(im => colorOf(im) && colorOf(im) !== chosen);
    if (mixed) {
      const i = imgs.findIndex(im => colorOf(im) === chosen);
      if (i >= 0) at = i;
    }
  }

  const pick = imgs[at];
  setHero(sid, pick);

  rail.remove();
  document.getElementById('viewall-' + sid)?.remove();
  wrap.insertAdjacentHTML('beforeend', thumbsMarkup(imgs, sid, pick?.url));

  /* Re-warm the whole neighbourhood, not just this colour's photos. Changing colour moves
     what is one click away: on a cap, "the other embroidery at THIS colour" only becomes
     adjacent once this colour is selected, and warming the current gallery alone left it
     cold. warmOtherColors already covers the current gallery as its first tier, and the
     _warmed set means everything reached before is skipped rather than refetched. */
  warmOtherColors(sid);
}

function safeId(gid) { return gid.replace(/[^a-z0-9]/gi, ''); }
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const _cards = {};

function renderProducts(products) {
  const grid = document.getElementById('product-grid');
  if (!products.length) {
    grid.innerHTML = '<p class="status-msg">No products yet, check back soon.</p>';
    return;
  }
  // When the grid first painted, and whether that came from cache or the network.
  if (!window.__firstPaint) window.__firstPaint = { at: Math.round(performance.now()), source: window.__renderSource || 'network' };
  _products = products;
  if (products.length === 1) grid.classList.add('single');
  grid.innerHTML = products.map(buildGridCard).join('');
  buildFilters(products);
  route();
  gtag('event', 'view_item_list', {
    item_list_name: 'Merch',
    items: products.map(p => ({
      item_id: p.id,
      item_name: p.title,
      price: parseFloat(p.priceRange.minVariantPrice.amount),
      currency: p.priceRange.minVariantPrice.currencyCode
    }))
  });
}

let _products = [];

/* ── Routing ──────────────────────────────────────────────
   Hash router so a product is linkable and the back button works, without needing a
   file per product (products come from Shopify at runtime, so static pages are out).
   Category filters keep using a bare #hats hash; products use #/product/<id>. */
function route() {
  const m = (location.hash || '').match(/^#\/product\/(.+)$/);
  if (m) showProduct(decodeURIComponent(m[1]));
  else showGrid();
}
window.addEventListener('hashchange', route);

function showProduct(id) {
  const p = _products.find(x => safeId(x.id) === id || x.id === id);
  if (!p) { location.hash = ''; return; }
  document.getElementById('grid-view').hidden = true;
  const view = document.getElementById('product-view');
  view.hidden = false;
  view.innerHTML = buildProductPage(p, _pendingPreselect);
  _pendingPreselect = null;
  window.scrollTo(0, 0);
  warmOtherColors(safeId(p.id));
  gtag('event', 'view_item', {
    items: [{ item_id: p.id, item_name: p.title,
      price: parseFloat(p.priceRange.minVariantPrice.amount),
      currency: p.priceRange.minVariantPrice.currencyCode }]
  });
}

function showGrid() {
  const view = document.getElementById('product-view');
  view.hidden = true;
  view.innerHTML = '';
  document.getElementById('grid-view').hidden = false;
  const cat = (location.hash || '').replace('#', '');
  applyFilter(CATEGORIES.some(c => c.key === cat) || cat === 'other' ? cat : 'all', true);
}

/* Clicking a colour swatch in the grid should land on that colour, not the default.
   Held in a variable rather than the URL: the hash stays a clean product link, and the
   preselect is a one-shot hint consumed by the next render. */
let _pendingPreselect = null;
function openProduct(id, preselect) {
  _pendingPreselect = preselect || null;
  location.hash = '#/product/' + encodeURIComponent(id);
}

/* Grid cards carry image, name, price and colour swatches only. Everything else moved
   to the product page: cramming a gallery, a description and three option pickers into
   a 260px card is what made the old grid unreadable. */
function buildGridCard(p) {
  const sid = safeId(p.id);
  const variants = p.variants.edges.map(e => e.node);
  const options = p.options || [];
  const colorOpt = options.find(o => /^colou?r$/i.test(o.name));
  const price = fmt(p.priceRange.minVariantPrice.amount, p.priceRange.minVariantPrice.currencyCode);
  const available = variants.some(v => v.availableForSale);
  // Grid hero follows the same default, so the card and its product page agree.
  const want = defaultSelectionFor(p, options);
  const heroVariant = want
    ? variants.find(v => Object.entries(want).every(([n, val]) =>
        v.selectedOptions?.some(o => o.name === n && o.value === val))) || variants[0]
    : variants[0];
  const hero = heroVariant?.image || p.images.edges[0]?.node || null;

  // One swatch per colour, using that colour's own photo. Baymard's finding is that
  // hiding swatches behind a "+N more" on list items is a common mobile failure, so
  // show them all -- they are small, and the row wraps.
  let swatches = '';
  if (colorOpt) {
    const seen = new Map();
    variants.forEach(v => {
      const val = v.selectedOptions?.find(o => o.name === colorOpt.name)?.value;
      if (val && !seen.has(val) && v.image?.url) seen.set(val, v);
    });
    if (seen.size > 1) {
      swatches = `<div class="g-swatches">${[...seen].map(([val, v]) =>
        `<button class="g-swatch" title="${esc(val)}" aria-label="${esc(val)}"
           onclick="event.stopPropagation();openProduct('${sid}',{${esc(JSON.stringify(colorOpt.name))}:${esc(JSON.stringify(val))}})">
           <img src="${esc(cdnThumb(v.image.url, 90))}" alt="" loading="lazy"></button>`).join('')}
        </div>`;
    }
  }

  const count = colorOpt ? [...new Set(variants.map(v =>
    v.selectedOptions?.find(o => o.name === colorOpt.name)?.value).filter(Boolean))].length : 0;

  return `
    <div class="product-card" id="card-${sid}" data-cat="${categoryOf(p)}"
         onclick="openProduct('${sid}')" role="link" tabindex="0"
         onmouseenter="warmProduct('${sid}')" onfocus="warmProduct('${sid}')"
         onkeydown="if(event.key==='Enter')openProduct('${sid}')">
      <div class="product-img-wrap">
        ${hero ? `<img class="product-img" src="${esc(cdnThumb(hero.url, 600))}" alt="${esc(hero.altText || p.title)}" loading="lazy">`
               : `<div class="product-img" style="background:rgba(255,215,0,0.04)"></div>`}
      </div>
      <div class="product-name">${esc(p.title)}</div>
      <div class="product-price">${price}${!available ? ' <span class="g-sold">Sold out</span>' : ''}</div>
      ${swatches}
      ${count > 1 ? `<div class="g-count">${count} colors</div>` : ''}
    </div>`;
}

/* Only render a filter row when it earns its place: at least two categories present. */
function buildFilters(products) {
  const row = document.getElementById('filter-row');
  const counts = {};
  products.forEach(p => { const c = categoryOf(p); counts[c] = (counts[c] || 0) + 1; });
  const present = CATEGORIES.filter(c => counts[c.key]);
  if (counts.other) present.push({ key: 'other', label: 'Other' });
  if (present.length < 2) { row.hidden = true; return; }

  row.hidden = false;
  row.innerHTML = [{ key: 'all', label: 'All' }, ...present].map(c => {
    const n = c.key === 'all' ? products.length : counts[c.key];
    return `<button class="filter-btn" data-cat="${c.key}" onclick="applyFilter('${c.key}')">
      ${c.label}<span class="count">${n}</span></button>`;
  }).join('');

  const fromHash = (location.hash || '').replace('#', '');
  applyFilter(present.some(c => c.key === fromHash) ? fromHash : 'all', true);
}

function applyFilter(cat, skipHash) {
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === cat));
  let shown = 0;
  document.querySelectorAll('.product-card').forEach(card => {
    const hit = cat === 'all' || card.dataset.cat === cat;
    card.hidden = !hit;
    if (hit) shown++;
  });
  document.getElementById('empty-cat').hidden = shown > 0;
  if (!skipHash) history.replaceState(null, '', cat === 'all' ? location.pathname : '#' + cat);
}

/* Switching embroidery colour swaps to a different underlying Shopify product, which
   can carry a different set of cap colours. Rebuild the card rather than patching it,
   so an unavailable colour can never stay selected from the previous design. */
function selectEmbroidery(sid, val) {
  const card = _cards[sid];
  if (!card || !card.product) return;
  // Must target the product page, not the grid card. They previously shared an id, so
  // this replaced the hidden grid card and left two product pages in the document.
  const el = document.getElementById('pdp-' + sid);
  if (!el) return;
  /* Carry the shopper's colour across. Switching thread colour used to snap the cap back
     to its default colour, which reads as losing your place rather than restitching the
     hat you were looking at. Embroidery is listed first so that if this colour does not
     exist in the other design, the relaxing match in buildProductPage drops the colour
     and keeps the thread choice, never the reverse. */
  const keep = { Embroidery: val };
  for (const [k, v] of Object.entries(card.selected)) if (k !== 'Embroidery') keep[k] = v;

  // Hold the shopper's place in the gallery across the rebuild, same as a colour change.
  const rail = document.getElementById('ithumbs-' + sid);
  const wasAt = rail
    ? Math.max(0, [...rail.querySelectorAll('.img-thumb')].findIndex(b => b.classList.contains('active')))
    : 0;

  /* Work out which photo the new thread colour should open on BEFORE rebuilding, and
     hand it to the builder. Rebuilding first and correcting afterwards is what produced
     the flash: the page painted the default shot, then swapped to this one. */
  const nextImgs = galleryFor(card.product, card.options, keep);
  const target = nextImgs[Math.min(wasAt, Math.max(0, nextImgs.length - 1))];

  el.outerHTML = buildProductPage(card.product, keep, target?.url);
  // The neighbours changed with the thread colour, so re-warm what is now one click away.
  warmOtherColors(sid);
}

/* ── Lightbox ─────────────────────── */
let _lb = { imgs: [], i: 0 };

function openLightbox(sid) {
  const card = _cards[sid];
  if (!card || !card.images || !card.images.length) return;
  const current = heroRaw(sid);
  const at = card.images.findIndex(im => im.url === current);
  _lb = { imgs: card.images, i: at === -1 ? 0 : at };
  paintLightbox();
  const lb = document.getElementById('lightbox');
  _focusReturn = document.activeElement;
  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  lb._close = closeLightbox;
  trapFocus(lb);
  lb.querySelector('.lb-close')?.focus();
}

function paintLightbox() {
  const im = _lb.imgs[_lb.i];
  const el = document.getElementById('lb-img');
  el.src = cdnThumb(im.url, 1600);
  el.alt = im.altText || '';
  document.getElementById('lb-count').textContent = `${_lb.i + 1} / ${_lb.imgs.length}`;

  /* Rebuild on the actual image set, not its length. Comparing counts meant switching to
     a colour with the same number of photos kept the previous colour's thumbnails, so the
     strip showed one colour while the large image showed another. */
  const strip = document.getElementById('lb-strip');
  const key = _lb.imgs.map(i => i.url).join('|');
  if (strip.dataset.key !== key) {
    strip.dataset.key = key;
    strip.innerHTML = _lb.imgs.map((img, n) =>
      `<button onclick="jumpLightbox(${n})"><img src="${esc(cdnThumb(img.url, 150))}" alt="" loading="lazy"></button>`).join('');
  }
  [...strip.children].forEach((b, n) => b.classList.toggle('active', n === _lb.i));
  strip.children[_lb.i]?.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function jumpLightbox(n) { _lb.i = n; paintLightbox(); }

function stepLightbox(e, d) {
  if (e) e.stopPropagation();
  if (!_lb.imgs.length) return;
  _lb.i = (_lb.i + d + _lb.imgs.length) % _lb.imgs.length;
  paintLightbox();
}

function closeLightbox(e) {
  // Clicking the image itself should not close it, only the backdrop or the X.
  if (e && e.target && e.target.id === 'lb-img') return;
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  releaseFocus(lb);
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox')?.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(null, -1);
  if (e.key === 'ArrowRight') stepLightbox(null, 1);
});

/* heroUrl lets the caller name the photo to open on. Without it a rebuild always paints
   the variant's default shot, so switching embroidery flashed that default before
   jumping to the photo the shopper was actually looking at. */
function buildProductPage(p, preselect, heroUrl) {
  const sid = safeId(p.id);
  const variants = p.variants.edges.map(e => e.node);
  const options = p.options || [];
  const price = fmt(p.priceRange.minVariantPrice.amount, p.priceRange.minVariantPrice.currencyCode);
  const available = variants.some(v => v.availableForSale);
  const firstVariant = variants[0];
  const colorOpt = options.find(o => /^colou?r$/i.test(o.name));
  const sizeOpt  = options.find(o => /^size$/i.test(o.name));
  const embOpt   = options.find(o => /^embroidery$/i.test(o.name));
  const isDefault = variants.length === 1 && variants[0].title === 'Default Title';

  // Seed defaults from Printful's chosen default variant, then apply any override
  // (used when switching embroidery colour, which rebuilds the card).
  /* Match as much of the request as the product actually offers, dropping constraints
     from the end until something matches. Order matters: the caller puts the option it
     cares most about first, so switching embroidery keeps the thread colour even when
     the cap colour does not exist in the other design. */
  let seedVariant = null;
  const wanted = preselect || defaultSelectionFor(p, options);
  if (wanted) {
    const entries = Object.entries(wanted);
    for (let n = entries.length; n > 0 && !seedVariant; n--) {
      const subset = entries.slice(0, n);
      seedVariant = variants.find(v =>
        subset.every(([name, val]) => v.selectedOptions?.some(o => o.name === name && o.value === val)));
    }
  }
  seedVariant = seedVariant || firstVariant;
  const initSelected = {};
  if (!isDefault && seedVariant?.selectedOptions) {
    seedVariant.selectedOptions.forEach(o => { initSelected[o.name] = o.value; });
  }
  let mainImg = seedVariant?.image || null;
  // Thumbnail list: put the selected image first so it appears leftmost
  const allImages = galleryFor(p, options, initSelected);
  // Open on the requested photo when it exists in this gallery, so the page paints the
  // right image once instead of painting a default and then correcting itself.
  if (heroUrl) {
    const want = allImages.find(im => im.url === heroUrl);
    if (want) mainImg = want;
  }
  _cards[sid] = { variants, options, selected: initSelected, images: allImages, product: p };

  /* The hero renders about 533px wide; 1000 covers a 2x screen at a third of the bytes
     of the 2000px original. data-raw carries the untouched url, which openLightbox and
     the gallery use to work out which photo is on screen. */
  const mainImgHtml = mainImg
    ? `<img class="product-img" id="img-${sid}" src="${esc(cdnThumb(mainImg.url, 1000))}"
         data-raw="${esc(mainImg.url)}" alt="${esc(mainImg.altText || p.title)}"
         onclick="openLightbox('${sid}')" title="Click to enlarge">`
    : `<div class="product-img" style="background:rgba(255,215,0,0.04)"></div>`;

  /* Every thumbnail for the current selection, no truncation. Baymard: truncating a
     gallery with no signpost makes users assume the visible thumbnails are all there is,
     which is exactly what the old "+22" badge did. */
  const thumbsHtml = thumbsMarkup(allImages, sid, mainImg?.url);

  // Embroidery colour, only present on merged cap designs (see MERGE_GROUPS).
  let embHtml = '';
  if (embOpt && embOpt.values.length > 1) {
    const initEmb = initSelected[embOpt.name];
    embHtml = `<div class="option-label">Embroidery: <span class="opt-current" id="elabel-${sid}">${esc(initEmb)}</span></div>
      <div class="size-picker" id="epicker-${sid}">
        ${embOpt.values.map(ev => `<button class="size-btn${ev === initEmb ? ' active' : ''}"
          data-opt="${esc(embOpt.name)}" data-val="${esc(ev)}"
          onclick="selectEmbroidery('${sid}','${esc(ev)}')">${esc(ev)}</button>`).join('')}
      </div>`;
  }

  /* Every colour, in the product's own order. The old card truncated to five behind a
     "+N more"; Baymard flags hidden swatches as a common reason shoppers never find a
     variant, and a product page has the room. */
  let colorHtml = '';
  if (colorOpt && !isDefault) {
    const seen = new Map();
    variants.forEach(v => {
      const val = v.selectedOptions?.find(o => o.name === colorOpt.name)?.value;
      if (val && !seen.has(val)) seen.set(val, v);
    });
    if (seen.size > 1) {
      const initColor = initSelected[colorOpt.name];
      const colorEntries = colorOpt.values.filter(v => seen.has(v)).map(v => [v, seen.get(v)]);
      const renderBtn = ([val, v]) => `<button
        class="size-btn${val === initColor ? ' active' : ''}"
        data-opt="${esc(colorOpt.name)}" data-val="${esc(val)}"
        data-img-url="${esc(v.image?.url)}" data-img-alt="${esc(v.image?.altText)}"
        onmouseenter="warmColor('${sid}',this.dataset.val)"
        onclick="selectOpt(this,'${sid}')">${esc(val)}</button>`;
      colorHtml = `<div class="option-label">Color: <span class="opt-current" id="clabel-${sid}">${esc(initColor)}</span></div>
        <div class="size-picker" id="cthumbs-${sid}">
          ${colorEntries.map(renderBtn).join('')}
        </div>`;
    }
  }

  // Size picker
  let sizeHtml = '';
  if (sizeOpt && !isDefault) {
    const initColor = initSelected[colorOpt?.name];
    const initSize  = initSelected[sizeOpt.name];
    sizeHtml = `<div class="option-label">Size: <span class="opt-current" id="slabel-${sid}">${esc(initSize)}</span></div>
      <div class="size-picker" id="spicker-${sid}">
        ${sortSizes(sizeOpt.values).map(sv => {
          const ok = variants.some(v => {
            const hasSize  = v.selectedOptions?.some(o => o.name === sizeOpt.name && o.value === sv);
            const hasColor = !colorOpt || !initColor || v.selectedOptions?.some(o => o.name === colorOpt.name && o.value === initColor);
            return hasSize && hasColor && v.availableForSale;
          });
          return `<button class="size-btn${sv === initSize ? ' active' : ''}"
            data-opt="${esc(sizeOpt.name)}" data-val="${esc(sv)}"
            onclick="selectOpt(this,'${sid}')" ${!ok ? 'disabled' : ''}>${esc(sv)}</button>`;
        }).join('')}
      </div>`;
  }

  // Fallback: flat variant buttons for products with unrecognised option types
  let legacyHtml = '';
  if (!colorOpt && !sizeOpt && variants.length > 1 && !isDefault) {
    legacyHtml = `<div class="variant-buttons" id="vbtns-${sid}">
      ${variants.map((v, i) => `<button class="variant-btn${i === 0 ? ' active' : ''}"
        data-vid="${esc(v.id)}" data-img-url="${esc(v.image?.url)}" data-img-alt="${esc(v.image?.altText)}"
        data-price="${esc(v.priceV2?.amount)}" onclick="selectVariant(this,'${sid}')"
        ${!v.availableForSale ? 'disabled' : ''}>${esc(v.title)}</button>`).join('')}
    </div>`;
  }

  /* Full description, no truncation. It used to be cut at 100 characters because it was
     competing for room in a 260px card. On a product page it has a column to itself.
     Printful writes one long paragraph with bullet-ish fragments after a colon, so split
     those onto their own lines rather than showing an unreadable wall. */
  const descHtml = (() => {
    if (!p.description) return '';
    /* Printful appends the same print-on-demand disclaimer to every product, unpunctuated,
       so it runs on into the last spec bullet and ends with a stray "Size guide". Cut it:
       it is identical on all seven products and says nothing about this one. */
    const cleaned = String(p.description)
      .replace(/This product is made especially for you[\s\S]*$/i, '')
      .replace(/\s*Size guide\s*$/i, '')
      .trim();
    const parts = cleaned.split(/\s*•\s*|\s*\|\s*/).map(s => s.trim().replace(/[.\s]+$/, '')).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length < 3) return `<div class="pdp-desc"><p>${esc(cleaned)}</p></div>`;
    const [intro, ...bullets] = parts;
    return `<div class="pdp-desc">
      <p>${esc(intro)}</p>
      <ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
    </div>`;
  })();

  return `
    <article class="pdp" id="pdp-${sid}">
      <button class="pdp-back" onclick="location.hash=''">&#8592; All merch</button>
      <div class="pdp-cols">
        <div class="pdp-gallery">
          <div class="product-img-wrap pdp-hero">${mainImgHtml}</div>
          ${thumbsHtml}
        </div>
        <div class="pdp-info">
          <h1 class="pdp-title">${esc(p.title)}</h1>
          <div class="pdp-price">${price}</div>
          <!-- "flat rate" implied one price no matter how many items, which is not true:
               Printful charges per additional item. Neither cost nor arrival date can be
               known here, and only Shopify's checkout figures are guaranteed to match
               what the shopper sees next, so quote production time and defer the rest. -->
          <p class="pdp-ship">Made to order, ${MAKE_TIME[categoryOf(p)] || MAKE_TIME.other},
            then shipped &middot; delivery and shipping cost calculated at checkout</p>
          ${embHtml}${colorHtml}${sizeHtml}${legacyHtml}
          ${sizeGuideMarkup(p, sid)}
          <button class="add-btn pdp-add" id="add-${sid}"
            data-sid="${sid}" data-vid="${seedVariant?.id || ''}"
            data-product-name="${esc(p.title)}"
            data-price="${seedVariant?.priceV2?.amount || p.priceRange.minVariantPrice.amount}"
            data-currency="${p.priceRange.minVariantPrice.currencyCode}"
            onclick="handleAdd(this)" ${!available ? 'disabled' : ''}>
            ${available ? 'Add to Cart' : 'Sold Out'}
          </button>
          ${descHtml}
          <!-- Every item is printed or embroidered per order, so there is no stock to
               take anything back into. Say so plainly on the product page: 60% of
               shoppers look for the returns terms before buying, and a policy found
               after the fact is where chargebacks come from. -->
          <details class="pdp-policy">
            <summary>Returns &amp; exchanges</summary>
            <p>Every item is made to order, printed or embroidered once you buy it. Because
            nothing is held in stock, <strong>we cannot accept returns or exchanges for size,
            fit, or change of mind</strong>. Please check the size guide before ordering.</p>
            <p>If your order arrives <strong>damaged, misprinted, or not what you ordered</strong>,
            it gets replaced free. Reply to your order confirmation email within 30 days of
            delivery with a photo and we will sort it out.</p>
          </details>
        </div>
      </div>
    </article>`;
}

function selectOpt(btn, sid, skipImageSwap) {
  const card = _cards[sid];
  if (!card) return;
  const optName = btn.dataset.opt;
  const optVal  = btn.dataset.val;
  card.selected[optName] = optVal;

  // Mark active in this group
  btn.closest('.size-picker')
    ?.querySelectorAll('button')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  // Update inline option label
  const colorOpt = card.options.find(o => /^colou?r$/i.test(o.name));
  const sizeOpt  = card.options.find(o => /^size$/i.test(o.name));
  if (colorOpt && optName === colorOpt.name) {
    const lbl = document.getElementById(`clabel-${sid}`);
    if (lbl) lbl.textContent = optVal;
  }
  if (sizeOpt && optName === sizeOpt.name) {
    const lbl = document.getElementById(`slabel-${sid}`);
    if (lbl) lbl.textContent = optVal;
  }

  // Swap to the selected VARIANT's own image, whichever option changed. This used to
  // fire only when the changed option was named "Color", so the can cooler -- whose only
  // option is Size (Slim/Regular 12 oz), each with its own photo -- never switched
  // pictures. Resolving the variant is also more accurate than trusting the colour pill,
  // since the variant image is the authoritative one for the exact combination chosen.
  // Changing SIZE on a product that also has a colour never changes how it looks, and
  // swapping would throw away whichever photo of that colour the shopper had picked.
  // Size-only products (the can cooler: Slim vs Regular 12 oz) still swap, since there
  // the size genuinely is a different photo.
  // Colour is handled by refreshGallery below, which holds the shopper's place in the
  // gallery. Letting the generic swap run first would jump them to Printful's default
  // photo for that colour and undo it.
  const sizeOnlyReskin = sizeOpt && colorOpt && optName === sizeOpt.name;
  const colorHandledByGallery = colorOpt && optName === colorOpt.name;
  if (!skipImageSwap && !sizeOnlyReskin && !colorHandledByGallery) {
    const sel = card.selected;
    const match = card.variants.find(v =>
      (v.selectedOptions || []).every(o => sel[o.name] === undefined || sel[o.name] === o.value)
      && (v.selectedOptions || []).length === Object.keys(sel).length
    ) || card.variants.find(v =>
      (v.selectedOptions || []).some(o => o.name === optName && o.value === optVal)
    );
    const url = match?.image?.url || btn.dataset.imgUrl;
    if (url) swapMainImage(sid, url, match?.image?.altText || btn.dataset.imgAlt || '');
  }

  // Colour drives the gallery: picking Sage should leave only Sage photos on screen.
  if (colorOpt && optName === colorOpt.name) refreshGallery(sid);

  // Colour additionally refreshes which sizes are still available in that colour.
  if (colorOpt && optName === colorOpt.name) {
    if (sizeOpt) {
      const selectedColor = card.selected[colorOpt.name];
      const selectedSize  = card.selected[sizeOpt.name];
      document.getElementById(`spicker-${sid}`)
        ?.querySelectorAll('.size-btn')
        .forEach(sb => {
          const sv = sb.dataset.val;
          const ok = card.variants.some(v => {
            const hasColor = v.selectedOptions?.some(o => o.name === colorOpt.name && o.value === selectedColor);
            const hasSize  = v.selectedOptions?.some(o => o.name === sizeOpt.name  && o.value === sv);
            return hasColor && hasSize && v.availableForSale;
          });
          sb.disabled = !ok;
          if (sv === selectedSize && !ok) {
            sb.classList.remove('active');
            delete card.selected[sizeOpt.name];
          }
        });
    }
  }

  // Find matching variant and update Add to Cart
  const match = card.variants.find(v =>
    Object.entries(card.selected).every(([n, val]) =>
      v.selectedOptions?.some(o => o.name === n && o.value === val)
    )
  );
  const addBtn = document.getElementById(`add-${sid}`);
  if (match && addBtn) {
    addBtn.dataset.vid = match.id;
    if (match.priceV2?.amount) addBtn.dataset.price = match.priceV2.amount;
  }
}

function selectVariant(btn, sid) {
  document.querySelectorAll(`#vbtns-${sid} .variant-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const addBtn = document.getElementById(`add-${sid}`);
  addBtn.dataset.vid = btn.dataset.vid;
  if (btn.dataset.price) addBtn.dataset.price = btn.dataset.price;
  if (btn.dataset.imgUrl) swapMainImage(sid, btn.dataset.imgUrl, btn.dataset.imgAlt);
}

// Click a pill by option name/value, wherever it lives. Colour and size are rendered
// into two separate containers, so this looks in both rather than assuming one.
function applyOptByValue(sid, name, value) {
  for (const id of [`cthumbs-${sid}`, `spicker-${sid}`]) {
    for (const b of document.getElementById(id)?.querySelectorAll('.size-btn') || []) {
      if (b.dataset.opt !== name || b.dataset.val !== value) continue;
      if (b.classList.contains('active')) return true;   // already there, nothing to do
      if (b.disabled) return false;                      // out of stock; a shopper could
                                                         // not pick it either, so don't
      selectOpt(b, sid, true);                           // image already swapped above
      return true;
    }
  }
  return false;
}

function selectThumb(btn, sid) {
  document.getElementById(`ithumbs-${sid}`)
    ?.querySelectorAll('.img-thumb')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  swapMainImage(sid, btn.dataset.imgUrl, btn.dataset.imgAlt, true);
  // Moving down the rail changes which photo every neighbour would open on, so the warm
  // set has to follow. Already-fetched urls are skipped, so this is cheap to repeat.
  warmOtherColors(sid);

  // Picking a photo should also pick the thing in the photo. This used to scan the
  // colour pills only, so hats followed the gallery but the can cooler -- whose only
  // option is Size -- did not. Resolve the variants that OWN this image instead, and
  // apply their options whatever those options are called.
  const card   = _cards[sid];
  const imgUrl = btn.dataset.imgUrl;
  if (!card || !imgUrl) return;

  let owners = card.variants.filter(v => v.image?.url === imgUrl);

  // Shopify marks exactly ONE image per variant as that variant's featured image, so a
  // product shot from a second angle arrives attached to nothing -- the can cooler's
  // "front" photos are plainly a slim and a regular koozie, but the API does not say so.
  // Printful names its files after the variant, so fall back to reading the filename.
  // Only an unambiguous match counts, because guessing wrong would silently change what
  // the shopper is about to buy.
  if (!owners.length) {
    const file = imgUrl.split('/').pop().split('?')[0].toLowerCase();
    const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const inferred = [];
    for (const opt of card.options || []) {
      // Longest match wins so that "Black/ White" beats a bare "Black" on the same file.
      const hit = (opt.values || [])
        .filter(v => { const s = slug(v); return s && new RegExp(`(^|-)${s}(-|\\.|$)`).test(file); })
        .sort((a, b) => slug(b).length - slug(a).length)[0];
      if (hit) inferred.push({ name: opt.name, value: hit });
    }
    if (inferred.length) {
      // Trust it only if it actually names a real variant.
      const v = card.variants.find(v =>
        inferred.every(i => v.selectedOptions?.some(o => o.name === i.name && o.value === i.value)));
      if (v) owners = [v];
    }
  }

  // Images tied to no variant even after that (lifestyle and back-of-garment shots) say
  // nothing about the selection, so they just change the picture. Same for the flat
  // variant-button fallback, which carries its own image on the button.
  if (!owners.length) {
    for (const vb of document.getElementById(`vbtns-${sid}`)?.querySelectorAll('.variant-btn') || []) {
      if (vb.dataset.imgUrl === imgUrl && !vb.classList.contains('active')) {
        vb.closest('.variant-buttons').querySelectorAll('.variant-btn')
          .forEach(b => b.classList.remove('active'));
        vb.classList.add('active');
        const addBtn = document.getElementById(`add-${sid}`);
        if (addBtn) {
          addBtn.dataset.vid = vb.dataset.vid;
          if (vb.dataset.price) addBtn.dataset.price = vb.dataset.price;
        }
        break;
      }
    }
    return;
  }

  // Apply only the options every owner agrees on. One photo usually covers every SIZE
  // of a colour, and in that case it tells you the colour and nothing about the size --
  // so overwriting the shopper's chosen size off the back of it would be wrong.
  const names = [...new Set(owners.flatMap(v => (v.selectedOptions || []).map(o => o.name)))];
  const agreed = [];
  for (const n of names) {
    const vals = new Set(owners.map(v => v.selectedOptions?.find(o => o.name === n)?.value));
    if (vals.size === 1) agreed.push({ name: n, value: [...vals][0] });
  }

  // Colour first: choosing it re-checks which sizes are still in stock, and running
  // that check after the size was set would test it against the previous colour.
  agreed.sort((a, b) => (/^colou?r$/i.test(a.name) ? 0 : 1) - (/^colou?r$/i.test(b.name) ? 0 : 1));
  for (const o of agreed) applyOptByValue(sid, o.name, o.value);
}

function swapMainImage(sid, url, alt, skipThumbSync) {
  const imgEl = document.getElementById(`img-${sid}`);
  // Compare against the ORIGINAL url: src now carries a CDN-resized variant, so
  // comparing src would never match and would re-fetch the full-size original.
  if (!imgEl || imgEl.dataset.raw === url) return;
  const sized = cdnThumb(url, 1000);
  imgEl.classList.add('fading');
  const start = Date.now();
  const preload = new Image();
  preload.onload = preload.onerror = () => {
    const wait = Math.max(0, 150 - (Date.now() - start));
    setTimeout(() => {
      imgEl.src = sized;
      imgEl.dataset.raw = url;
      imgEl.alt = alt || '';
      imgEl.classList.remove('fading');
      if (!skipThumbSync) {
        const thumbs = document.getElementById(`ithumbs-${sid}`);
        thumbs?.querySelectorAll('.img-thumb').forEach(b => {
          const match = b.dataset.imgUrl === url;
          b.classList.toggle('active', match);
          if (match) b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        });
      }
    }, wait);
  };
  // Preload the file that will actually be displayed. This warmed the 2000px original
  // while the element was then pointed at the 1000px variant, so the swap happened
  // against a file that had never been fetched and the image blanked while it loaded.
  preload.src = sized;
}


// ── Cart ──────────────────────────────────────────────────

const CART_FIELDS = `
  id checkoutUrl totalQuantity
  lines(first: 20) {
    edges {
      node {
        id quantity
        cost { totalAmount { amount currencyCode } }
        merchandise {
          ... on ProductVariant {
            id title
            image { url altText }
            selectedOptions { name value }
            product { title featuredImage { url altText } }
            priceV2 { amount currencyCode }
          }
        }
      }
    }
  }
  estimatedCost { subtotalAmount { amount currencyCode } }
`;

async function createCartWith(variantId) {
  const data = await shopify(`
    mutation($lines: [CartLineInput!]) {
      cartCreate(input: { lines: $lines }) { cart { ${CART_FIELDS} } }
    }`, { lines: [{ merchandiseId: variantId, quantity: 1 }] });
  return data.cartCreate.cart;
}

async function addLineToCart(variantId) {
  const data = await shopify(`
    mutation($cartId: ID!, $lines: [CartLineInput!]!) {
      cartLinesAdd(cartId: $cartId, lines: $lines) { cart { ${CART_FIELDS} } }
    }`, { cartId, lines: [{ merchandiseId: variantId, quantity: 1 }] });
  return data.cartLinesAdd.cart;
}

async function removeLineFromCart(lineId) {
  const data = await shopify(`
    mutation($cartId: ID!, $lineIds: [ID!]!) {
      cartLinesRemove(cartId: $cartId, lineIds: $lineIds) { cart { ${CART_FIELDS} } }
    }`, { cartId, lineIds: [lineId] });
  return data.cartLinesRemove.cart;
}

async function setLineQty(lineId, quantity) {
  // Dropping to zero is a removal, not a zero-quantity line.
  if (quantity < 1) return removeLineFromCart(lineId);
  const data = await shopify(`
    mutation($cartId: ID!, $lines: [CartLineUpdateInput!]!) {
      cartLinesUpdate(cartId: $cartId, lines: $lines) { cart { ${CART_FIELDS} } }
    }`, { cartId, lines: [{ id: lineId, quantity }] });
  return data.cartLinesUpdate.cart;
}

// Shopify's CDN resizes on request, so ask for the size actually being displayed
// instead of pulling a 2000px product shot into a 56px tile.
function cdnThumb(url, px) {
  try {
    const u = new URL(url);
    u.searchParams.set('width', px);
    return u.toString();
  } catch { return url; }
}

async function handleAdd(btn) {
  const variantId = btn.dataset.vid;
  if (!variantId) return;

  const orig = btn.textContent.trim();
  btn.textContent = 'Adding…';
  btn.disabled = true;

  try {
    let cart;
    if (!cartId) {
      cart = await createCartWith(variantId);
      cartId = cart.id;
      localStorage.setItem('bd_cart_id', cartId);
    } else {
      try {
        cart = await addLineToCart(variantId);
        if (!cart) throw new Error('null cart');
      } catch {
        cartId = null;
        localStorage.removeItem('bd_cart_id');
        cart = await createCartWith(variantId);
        cartId = cart.id;
        localStorage.setItem('bd_cart_id', cartId);
      }
    }
    updateCartUI(cart);
    gtag('event', 'add_to_cart', {
      currency: btn.dataset.currency || 'USD',
      value: parseFloat(btn.dataset.price || 0),
      items: [{ item_id: variantId, item_name: btn.dataset.productName || '', price: parseFloat(btn.dataset.price || 0), quantity: 1 }]
    });
    btn.textContent = 'Added!';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1400);
    openCart();
  } catch (err) {
    console.error(err);
    btn.textContent = 'Try Again';
    btn.disabled = false;
  }
}

// Each click re-renders the whole list from the server's reply, so a second click
// landing mid-flight would act on buttons that are about to be replaced. Freeze the
// list until the response arrives rather than trying to reconcile the two.
let cartBusy = false;
async function mutateCart(fn) {
  if (cartBusy) return;
  cartBusy = true;
  const itemsEl = document.getElementById('cart-items');
  itemsEl.classList.add('busy');
  try {
    const cart = await fn();
    if (cart) updateCartUI(cart);
  } catch (err) {
    console.error(err);
  } finally {
    cartBusy = false;
    itemsEl.classList.remove('busy');
  }
}

async function removeLine(lineId) {
  return mutateCart(() => removeLineFromCart(lineId));
}

async function changeQty(lineId, quantity) {
  return mutateCart(() => setLineQty(lineId, quantity));
}

function updateCartUI(cart) {
  currentCart = cart;
  const qty = cart.totalQuantity;
  const lines = cart.lines.edges.map(e => e.node);

  document.getElementById('cart-toggle').hidden = qty === 0;
  document.getElementById('cart-count').textContent = qty;
  try {
    const cu = new URL(cart.checkoutUrl);
    if (cu.protocol === 'https:') {
      document.getElementById('checkout-btn').href = cart.checkoutUrl;
    }
  } catch { /* invalid URL, leave href as '#' */ }

  const emptyEl = document.getElementById('cart-empty');
  const footerEl = document.getElementById('cart-footer');
  const itemsEl = document.getElementById('cart-items');

  if (!lines.length) {
    itemsEl.innerHTML = '';
    emptyEl.hidden = false;
    footerEl.hidden = true;
    return;
  }

  emptyEl.hidden = true;
  footerEl.hidden = false;
  document.getElementById('cart-subtotal').textContent =
    `Subtotal: ${fmt(cart.estimatedCost.subtotalAmount.amount, cart.estimatedCost.subtotalAmount.currencyCode)}`;

  itemsEl.innerHTML = lines.map(line => {
    const m = line.merchandise;
    // Variants without their own photo fall back to the product's featured image, so a
    // line never renders as an empty tile.
    const img = m.image || m.product.featuredImage;
    // selectedOptions is the same information as m.title but already broken apart.
    // m.title arrives slash-joined ("Navy / S/M"), and reads as "Default Title" on
    // single-variant products, which should show nothing at all.
    const opts = (m.selectedOptions || []).filter(o => o.value && o.value !== 'Default Title');
    const unit  = fmt(m.priceV2.amount, m.priceV2.currencyCode);
    const total = line.cost?.totalAmount
      ? fmt(line.cost.totalAmount.amount, line.cost.totalAmount.currencyCode)
      : fmt(m.priceV2.amount * line.quantity, m.priceV2.currencyCode);
    return `
      <div class="cart-item">
        ${img ? `<img class="cart-item-img" src="${esc(cdnThumb(img.url, 112))}"
             alt="${esc(img.altText || m.product.title)}" loading="lazy">` : ''}
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(m.product.title)}</div>
          ${opts.length ? `<div class="cart-item-opts">${opts.map(o =>
            `<span class="cart-item-opt"><em>${esc(o.name)}</em>${esc(o.value)}</span>`).join('')}</div>` : ''}
          <div class="cart-item-qty">
            <button data-line-id="${esc(line.id)}" data-qty="${line.quantity - 1}"
                    aria-label="Decrease quantity of ${esc(m.product.title)}">&minus;</button>
            <span aria-live="polite">${line.quantity}</span>
            <button data-line-id="${esc(line.id)}" data-qty="${line.quantity + 1}"
                    aria-label="Increase quantity of ${esc(m.product.title)}">+</button>
          </div>
        </div>
        <div class="cart-item-right">
          <button class="cart-item-remove" data-line-id="${esc(line.id)}"
                  aria-label="Remove ${esc(m.product.title)}">&#10005;</button>
          <div class="cart-item-price">${total}${
            line.quantity > 1 ? `<span class="cart-item-each">${unit} each</span>` : ''}</div>
        </div>
      </div>`;
  }).join('');

  itemsEl.onclick = e => {
    const rm = e.target.closest('.cart-item-remove');
    if (rm) return removeLine(rm.dataset.lineId);
    const q = e.target.closest('[data-qty]');
    if (q) return changeQty(q.dataset.lineId, parseInt(q.dataset.qty, 10));
  };
}

function trackCheckout() {
  if (!currentCart) return;
  const lines = currentCart.lines.edges.map(e => e.node);
  gtag('event', 'begin_checkout', {
    currency: currentCart.estimatedCost.subtotalAmount.currencyCode,
    value: parseFloat(currentCart.estimatedCost.subtotalAmount.amount),
    items: lines.map(l => ({
      item_id: l.merchandise.id,
      item_name: l.merchandise.product.title,
      item_variant: l.merchandise.title !== 'Default Title' ? l.merchandise.title : undefined,
      price: parseFloat(l.merchandise.priceV2.amount),
      quantity: l.quantity
    }))
  });
}

/* ── Overlay focus handling ───────────────────────────────
   Purely additive: it only reacts to Tab and Escape, and only while an overlay is open,
   so pointer users see no change at all. Without it a keyboard user tabs straight past
   the drawer into the page behind it, which is still fully interactive underneath. */
let _focusReturn = null;

function trapFocus(container) {
  const SEL = 'a[href],button:not([disabled]),input,select,textarea,summary,[tabindex]:not([tabindex="-1"])';
  const onKey = e => {
    if (e.key === 'Escape') { container._close?.(); return; }
    if (e.key !== 'Tab') return;
    const items = [...container.querySelectorAll(SEL)].filter(el => el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  container._onKey = onKey;
  document.addEventListener('keydown', onKey);
}

function releaseFocus(container) {
  if (container._onKey) document.removeEventListener('keydown', container._onKey);
  container._onKey = null;
  // Send the caret back where it came from, so Tab resumes from the button they pressed.
  if (_focusReturn && document.contains(_focusReturn)) _focusReturn.focus();
  _focusReturn = null;
}

function openCart() {
  const d = document.getElementById('cart-drawer');
  _focusReturn = document.activeElement;
  d.classList.add('open');
  d.setAttribute('aria-hidden', 'false');
  document.getElementById('cart-overlay').classList.add('visible');
  d._close = closeCart;
  trapFocus(d);
  d.querySelector('.cart-close')?.focus();
}
function closeCart() {
  const d = document.getElementById('cart-drawer');
  d.classList.remove('open');
  d.setAttribute('aria-hidden', 'true');
  document.getElementById('cart-overlay').classList.remove('visible');
  releaseFocus(d);
}

async function restoreCart() {
  if (!cartId) return;
  try {
    const data = await shopify(`
      query($id: ID!) { cart(id: $id) { ${CART_FIELDS} } }
    `, { id: cartId });
    if (data.cart) updateCartUI(data.cart);
    else { cartId = null; localStorage.removeItem('bd_cart_id'); }
  } catch (err) {
    console.error(err);
  }
}

loadProducts();
restoreCart();
</script>
