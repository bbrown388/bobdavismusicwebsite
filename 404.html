<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bob Davis Music</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X1W0TNHM51"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X1W0TNHM51');
  </script>
  <script>
    // GitHub Pages paths are case sensitive, but Windows is not, so a repo
    // cannot hold both /TCMA2026/ and /tcma2026/. The QR on the TCMA picks
    // encodes the UPPERCASE URL (uppercase packs into QR alphanumeric mode:
    // 29 modules instead of 33), so catch that case here and send it to the
    // real page. Everything else still falls through to the homepage.
    (function () {
      var raw = location.pathname.replace(/\/+$/, '');
      var target = { '/tcma2026': '/tcma2026/' }[raw.toLowerCase()];
      // Only redirect when the ONLY problem is letter case. If the lowercase
      // path 404s too the page is not deployed, and bouncing there again would
      // loop forever, so fall through to the homepage instead.
      var fromQr = !!target && raw !== raw.toLowerCase();
      var dest = fromQr ? target : '/';
      if (!fromQr) { location.replace(dest); return; }
      // Only the printed QR produces the uppercase path, so count it as a scan.
      // Wait for the hit to send before leaving, or the redirect beats gtag.js
      // and nothing is recorded. The timeout covers ad blockers.
      var left = false;
      function go() { if (!left) { left = true; location.replace(dest); } }
      gtag('event', 'tcma_qr_scan', {
        qr_path: raw,
        transport_type: 'beacon',
        event_callback: go,
        event_timeout: 1500
      });
      setTimeout(go, 2000);
    })();
  </script>
</head>
<body>
  <noscript><a href="/">Bob Davis Music</a></noscript>
</body>
</html>
