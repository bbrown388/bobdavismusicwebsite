  <script>
    // GitHub Pages paths are case sensitive, but Windows is not, so a repo
    // cannot hold both /TCMA2026/ and /tcma2026/. The QR on the TCMA picks
    // encodes the UPPERCASE URL (uppercase packs into QR alphanumeric mode:
    // 29 modules instead of 33), so catch that case here and send it to the
    // real page. Everything else still falls through to the homepage.
    (function () {
      var path = location.pathname.replace(/\/+$/, '').toLowerCase();
      var known = { '/tcma2026': '/tcma2026/' };
      location.replace(known[path] || '/');
    })();
  </script>
