<!-- PERMANENT PER-SONG REDIRECT. Lives under /listen/ so every redirect shares one namespace
     and the clean /2dollabill slug stays free for a real page about the song. /listen alone
     tracks the CURRENT single and moves on at the next release; this one never moves, so it is
     the link for print and anything with a long life.

     WHY THIS PAGE EXISTS
     HyperFollow cannot use a custom domain, DistroKid locks pages to distrokid.com, so a link
     straight to HyperFollow is invisible to this site's Google Analytics. Radio label copy,
     printed material and anywhere else off-site now points here instead, so the click is
     counted alongside the rest of the site before the visitor is handed on.

     The redirect deliberately waits for the analytics hit rather than firing instantly:
     gtag's event_callback fires once the hit is sent, with a timeout in case it never does,
     a meta refresh for no-JS, and a visible link if everything fails. A redirect that beats
     its own tracking call defeats the point of the page. -->

<!-- No-JS fallback. Long enough that JS normally wins the race. -->
<noscript><meta http-equiv="refresh" content="0; url=https://distrokid.com/hyperfollow/bobdavis1/2-dolla-bill/"></noscript>

<!-- Deliberately NOT async, unlike the rest of the site. Async means gtag.js may still be
     loading when the event below runs, leaving it queued in dataLayer while the redirect
     fires, so the hit is never sent and event_callback never runs. On a page whose only job
     is to record the click before handing off, a few ms of blocking is the correct trade. -->
<script src="https://www.googletagmanager.com/gtag/js?id=G-X1W0TNHM51"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-X1W0TNHM51');
</script>

<script>
(function () {
  var DEST = 'https://distrokid.com/hyperfollow/bobdavis1/2-dolla-bill/';
  var gone = false;

  function go() {
    if (gone) return;
    gone = true;
    // replace() so Back returns to wherever they came from rather than bouncing
    // through this page again.
    location.replace(DEST);
  }

  // Named to match the homepage card, which already distinguishes presave from listen so the
  // two entry points aggregate in the same report.
  var released = new Date() >= new Date('2026-10-02T00:00:00-05:00');

  gtag('event', released ? 'listen_click' : 'presave_click', {
    single: '2 Dolla Bill',
    source: 'domain_redirect',
    event_callback: go,
    event_timeout: 900
  });

  // Belt and braces: if the callback never fires, leave anyway.
  setTimeout(go, 1500);

  document.getElementById('manual').addEventListener('click', function () { gone = true; });
})();
</script>
