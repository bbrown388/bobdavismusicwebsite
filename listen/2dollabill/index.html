<!-- 2 Oct 2026: NOW A CHOOSER, not an auto-redirect. HyperFollow was still showing the pre-save
     page on release day, so this page links straight to each service through the per-platform
     redirects (each logs its own listen_click). Swap a button to HyperFollow only once it flips.

     PERMANENT PER-SONG LINK. Lives under /listen/ so every redirect shares one namespace
     and the clean /2dollabill slug stays free for a real page about the song. /listen alone
     tracks the CURRENT single and moves on at the next release; this one never moves, so it is
     the link for print and anything with a long life.

     WHY THIS PAGE EXISTS
     HyperFollow cannot use a custom domain, DistroKid locks pages to distrokid.com, so a link
     straight to HyperFollow is invisible to this site's Google Analytics. Radio label copy,
     printed material and anywhere else off-site now points here instead, so the click is
     counted alongside the rest of the site before the visitor is handed on.

     The redirect deliberately waits for the analytics hit rather than firing instantly:
     gtag's event_callback fires once the hit is sent, with a timeout in case it never does,
     a meta refresh for no-JS, and a visible link if everything fails. A redirect that beats
     its own tracking call defeats the point of the page. -->


<!-- Deliberately NOT async, unlike the rest of the site. Async means gtag.js may still be
     loading when the event below runs, leaving it queued in dataLayer while the redirect
     fires, so the hit is never sent and event_callback never runs. On a page whose only job
     is to record the click before handing off, a few ms of blocking is the correct trade. -->
<script src="https://www.googletagmanager.com/gtag/js?id=G-X1W0TNHM51"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-X1W0TNHM51');
</script>

<style>

  .svc { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; margin-top: 26px; }
  .svc a { display: block; padding: 14px 18px; border: 1px solid #C9A227; border-radius: 10px; color: #FFD700; text-decoration: none; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
  .svc a:hover, .svc a:focus-visible { background: #FFD700; color: #0d0608; }
  .svc a.more { border-color: rgba(201,162,39,0.4); color: #C9A227; font-size: 12px; }
  @media (prefers-color-scheme: light) { .svc a { color: #8a5a10; border-color: #8a5a10; } .svc a:hover { background: #8a5a10; color: #f3e9d6; } }
</style>

  <img src="../../images/2-dolla-bill-cover.jpg" alt="2 Dolla Bill single cover" width="900" height="900">
  <h1>2 Dolla Bill</h1>

  <p class="status">Out now. Pick your music service.</p>
  <div class="svc">
    <a href="spotify/">Spotify</a>
    <a href="apple/">Apple Music</a>
    <!-- Amazon and "More services" (HyperFollow) come back once each is confirmed to reach the
         released song; on 2 Oct both still led to the pre-save page. -->
  </div>

<script>
  // The landing itself is counted; each service button lands on its own per-platform redirect,
  // which records listen_click with the platform name before handing off.
  gtag('event', 'listen_page_view', { single: '2 Dolla Bill', source: 'chooser' });
</script>
