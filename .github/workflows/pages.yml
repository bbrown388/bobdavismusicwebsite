name: Deploy site and staging preview

# Pages is set to build from GitHub Actions rather than straight from a branch,
# so this workflow IS the deployment. Two jobs in one:
#
#   /          <- main, byte for byte what was served before
#   /preview/  <- the staging branch, rendered, for approval before merge
#
# main is PR-protected, so nothing reaches the live paths without Bob merging.
# A push to staging redeploys only the preview.
#
# /preview/ exists ONLY while staging is ahead of main, i.e. while something is
# genuinely waiting on review. Merge the PR and the next deploy drops the directory,
# so there is no stale public copy of the site sitting at a second URL between
# reviews. Deployments replace the whole artifact, so omitting the directory is
# what removes it.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a staging push
# cannot abort a main deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # Exposed so the notify job can say whether a preview was actually published
      # rather than linking to a directory that does not exist.
      ahead: ${{ steps.review.outputs.ahead }}
    steps:
      - name: Check out main (the live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0          # need history to compare against staging

      - name: Is anything actually in review?
        id: review
        run: |
          set -e
          cd site
          git fetch --quiet origin staging || true
          if git rev-parse --verify --quiet origin/staging > /dev/null; then
            # Commits staging has that main does not. Zero covers both "identical"
            # and "staging is behind main", which is the state right after a merge --
            # in neither case is there anything to review, and in the second case a
            # preview would show content OLDER than the live site.
            ahead=$(git rev-list --count origin/main..origin/staging)
          else
            ahead=0
          fi
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          if [ "$ahead" = "0" ]; then
            echo "nothing in review; /preview/ will not be published"
          else
            echo "$ahead commit(s) in review; publishing /preview/"
          fi

      - name: Check out staging (the preview)
        if: steps.review.outputs.ahead != '0'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src
        continue-on-error: true

      - name: Assemble
        run: |
          set -e
          # Copy staging in under /preview/, but only when the step above found work
          # in review. If the staging branch is missing or empty the site still
          # deploys; the preview is a bonus, never a gate.
          if [ "${{ steps.review.outputs.ahead }}" != "0" ] && [ -d staging-src ]; then
            mkdir -p site/preview
            rsync -a --delete --exclude '.git' --exclude 'CNAME' staging-src/ site/preview/
            echo "preview assembled from staging"
          else
            echo "nothing in review; deploying main only, no /preview/"
          fi

          # .nojekyll must exist or Pages ignores files starting with an
          # underscore. It is committed on main, but the preview needs its own.
          touch site/.nojekyll
          [ -d site/preview ] && touch site/preview/.nojekyll || true

          # Keep the preview out of search results. main's robots.txt is the
          # live one; append rather than replace so existing rules survive.
          if [ -f site/robots.txt ]; then
            grep -q '^Disallow: /preview/' site/robots.txt || printf '\nDisallow: /preview/\n' >> site/robots.txt
          else
            printf 'User-agent: *\nDisallow: /preview/\n' > site/robots.txt
          fi

          echo "--- deploying ---"
          ls site | head -20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # A push to staging means something is waiting on review. Opening the PR and
  # sending the alert by hand was the missing half: on 2026-08-19 a staging push
  # produced no notification at all, because nothing in this repo has ever sent one.
  #
  # Runs AFTER deploy on purpose. Notifying first would hand over a /preview/ link
  # that 404s until Pages finishes, which trains you to ignore the alert.
  notify-review:
    needs: deploy
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Job level, not step level: the secrets context is NOT available in a
      # step-level `if:`, which is what broke the merch-mockup workflow in
      # bobdavismusic-data. Read it here and test it inside the shell instead.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GH_TOKEN: ${{ github.token }}
      AHEAD: ${{ needs.deploy.outputs.ahead }}
      PREVIEW_URL: https://bobdavismusic.com/preview/
    steps:
      - name: Open the review PR, or reuse the one already open
        id: pr
        run: |
          set -e
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head staging --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "reusing open PR: $existing"
            echo "url=$existing" >> "$GITHUB_OUTPUT"
          elif [ "${AHEAD:-0}" = "0" ]; then
            echo "staging is not ahead of main, so there is nothing to open a PR for"
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Opened automatically when staging was deployed."
              echo ""
              echo "Preview: $PREVIEW_URL"
              echo ""
              echo "Merging publishes to production and drops the preview on the next deploy."
            } > pr-body.md
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head staging --base main --title "Review: staging into main" --body-file pr-body.md)
            echo "opened PR: $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify
        # always(): a failed PR step must not silently swallow the alert too. That is
        # exactly what happened on 2026-08-23, when the repo still blocked Actions from
        # creating PRs (Settings > Actions > General, off by default) and the whole job
        # died before notifying, so the push went out with no signal at all.
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -e
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not set on this repo, so no alert was sent."
            echo "Add it under Settings, Secrets and variables, Actions."
            exit 0
          fi
          if [ "${AHEAD:-0}" = "0" ]; then
            echo "Staging deployed but is not ahead of main, so no preview and no PR." > body.txt
          else
            {
              echo "Staging is ${AHEAD} commit(s) ahead, preview is live."
              echo ""
              echo "Preview: $PREVIEW_URL"
              echo "PR: ${PR_URL:-none}"
            } > body.txt
          fi
          curl -sS -X POST "https://ntfy.sh/${NTFY_TOPIC}" -H "Title: bobdavismusic staging ready to review" -H "Tags: eyes" -H "Click: $PREVIEW_URL" --data-binary @body.txt > /dev/null
          echo "alert sent"
