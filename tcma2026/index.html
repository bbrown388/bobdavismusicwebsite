<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bob Davis Music</title>
<meta name="robots" content="noindex">
<meta name="description" content="For the TCMA finalists.">
<meta property="og:title" content="Bob Davis Music">
<meta property="og:image" content="https://bobdavismusic.com/images/bob-davis-hero.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0d0608;
  color:#E8DCC8;
  font-family:Georgia, serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}

/* ── Stage: the video owns the screen until it's done ── */
#stage {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d0608;
  z-index:10;
  transition:opacity .9s ease, visibility .9s;
}
#stage.done { opacity:0; visibility:hidden; }

#vid {
  width:100%;
  height:100%;
  object-fit:contain;      /* works for a vertical or horizontal cut */
  background:#0d0608;
  display:block;
}

/* Tap layer. iOS and Android both refuse to autoplay audio, so one
   deliberate tap is the price of entry. Make it feel like a choice. */
#tap {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  cursor:pointer;
  background:radial-gradient(circle at center, rgba(13,6,8,.30) 0%, rgba(13,6,8,.78) 100%);
  transition:opacity .45s ease;
  -webkit-tap-highlight-color:transparent;
}
#tap.hide { opacity:0; pointer-events:none; }

.play-ring {
  width:96px; height:96px;
  border-radius:50%;
  border:2px solid rgba(255,215,0,.55);
  background:rgba(13,6,8,.55);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 44px rgba(255,215,0,.22);
  animation:pulse 2.6s ease-in-out infinite;
}
.play-ring svg { width:34px; height:34px; fill:#FFD700; margin-left:5px; }
@keyframes pulse {
  0%,100% { box-shadow:0 0 44px rgba(255,215,0,.22); }
  50%     { box-shadow:0 0 62px rgba(255,215,0,.38); }
}

.tap-label {
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#b09878;
  font-style:italic;
}

#skip {
  position:absolute;
  bottom:calc(22px + env(safe-area-inset-bottom));
  right:20px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#6b5c48;
  background:none; border:none;
  font-family:Georgia, serif;
  cursor:pointer;
  opacity:0;
  transition:opacity .5s ease;
}
#skip.show { opacity:1; }

/* ── What the video dissolves into. Same page, no navigation. ── */
#after {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:54px 20px calc(72px + env(safe-area-inset-bottom));
  opacity:0;
  transform:translateY(14px);
  transition:opacity 1.1s ease .25s, transform 1.1s ease .25s;
}
#after.in { opacity:1; transform:none; }

.mark { width:104px; margin-bottom:22px; opacity:.92; }

h1 {
  font-size:clamp(30px, 8vw, 42px);
  color:#FFD700;
  text-shadow:0 0 40px rgba(255,215,0,.4);
  letter-spacing:3px;
  line-height:1;
  margin-bottom:10px;
  text-align:center;
}

.genre {
  font-size:12px;
  color:#b09878;
  letter-spacing:2px;
  text-transform:uppercase;
  font-style:italic;
  margin-bottom:34px;
  text-align:center;
}

.note {
  max-width:420px;
  text-align:center;
  font-size:15px;
  line-height:1.7;
  color:#C8B89A;
  margin-bottom:38px;
}

.divider { width:40px; height:1px; background:rgba(255,215,0,.2); margin:0 auto 38px; }

.links { width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }

.link-btn {
  display:flex; align-items:center; justify-content:center; gap:12px;
  width:100%; padding:15px 20px;
  border-radius:12px;
  font-size:15px; font-family:Georgia, serif; font-weight:bold;
  text-decoration:none; letter-spacing:.5px;
  border:1px solid transparent;
  transition:filter .15s, transform .1s;
}
.link-btn:hover  { filter:brightness(1.12); }
.link-btn:active { transform:scale(.97); }
.link-btn svg { width:20px; height:20px; flex-shrink:0; fill:currentColor; }

.link-btn.shows     { background:rgba(180,60,30,.12);  border-color:rgba(220,80,40,.35);  color:#e87a5a; }
.link-btn.tiktok    { background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#E8DCC8; }
.link-btn.instagram { background:rgba(193,96,180,.12); border-color:rgba(193,96,180,.3);  color:#e0a8d8; }
.link-btn.facebook  { background:rgba(66,103,178,.12); border-color:rgba(66,103,178,.3);  color:#a0b8f0; }
.link-btn.merch     { background:rgba(205,150,50,.12); border-color:rgba(205,150,50,.35); color:#d4a853; }

.replay {
  margin-top:34px;
  font-size:11px; letter-spacing:2px; text-transform:uppercase;
  color:#6b5c48; background:none; border:none;
  font-family:Georgia, serif; cursor:pointer;
}
.replay:hover { color:#b09878; }
</style>
</head>
<body>

<div id="stage">
  <video id="vid" playsinline preload="metadata" poster="/tcma2026/bd-tcma-poster.jpg">
    <source src="/tcma2026/bd-tcma.mp4" type="video/mp4">
  </video>
  <div id="tap">
    <div class="play-ring">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="tap-label">Tap to play</div>
  </div>
  <button id="skip">Skip</button>
</div>

<div id="after">
  <img class="mark" src="/images/bd-mark.png" alt="" onerror="this.style.display='none'">
  <h1>BOB DAVIS</h1>
  <div class="genre">Country · Outlaw · Hip-Hop</div>

  <div class="note">Thanks for watching. Hang on to that two dollar bill.</div>

  <div class="divider"></div>

  <div class="links">
    <a class="link-btn shows" href="/live/">Shows</a>
    <a class="link-btn tiktok" href="https://www.tiktok.com/@bobdavismusic" target="_blank" rel="noopener">TikTok</a>
    <a class="link-btn instagram" href="https://www.instagram.com/bobdavismusic" target="_blank" rel="noopener">Instagram</a>
    <a class="link-btn facebook" href="https://www.facebook.com/share/1BQNcv6Zzt/" target="_blank" rel="noopener">Facebook</a>
    <a class="link-btn merch" href="/merch.html">Merch</a>
  </div>

  <button class="replay" id="replay">Watch again</button>
</div>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-X1W0TNHM51"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-X1W0TNHM51');

  var stage = document.getElementById('stage');
  var vid   = document.getElementById('vid');
  var tap   = document.getElementById('tap');
  var skip  = document.getElementById('skip');
  var after = document.getElementById('after');

  gtag('event', 'tcma_scan');

  function reveal() {
    stage.classList.add('done');
    after.classList.add('in');
    // Only scrollable once the video is out of the way.
    document.body.style.overflowY = 'auto';
  }

  function start() {
    tap.classList.add('hide');
    vid.play().then(function () {
      gtag('event', 'tcma_video_play');
      setTimeout(function () { skip.classList.add('show'); }, 2500);
    }).catch(function () {
      // Autoplay refused for a reason we can't fix; don't strand them.
      reveal();
    });
  }

  tap.addEventListener('click', start);
  skip.addEventListener('click', function (e) { e.stopPropagation(); vid.pause(); reveal(); });
  vid.addEventListener('ended', function () { gtag('event', 'tcma_video_complete'); reveal(); });

  document.getElementById('replay').addEventListener('click', function () {
    stage.classList.remove('done');
    after.classList.remove('in');
    document.body.style.overflowY = 'hidden';
    tap.classList.remove('hide');
    skip.classList.remove('show');
    vid.currentTime = 0;
  });

  document.body.style.overflowY = 'hidden';
</script>
</body>
</html>
